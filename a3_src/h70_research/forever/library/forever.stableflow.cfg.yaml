system:
  id_system: dm004_legend


###############################################################################
host:
  localhost:
    hostname:        'localhost'
    acct_run:        'wtp'
    acct_provision:  'wtp'
    port_range:      '8090-9000'
    dirpath_log:     ''
    environment:     'e002_general_research'
    launch_cmd:      ''
    log_level:       'TRACE'


###############################################################################
process:
  proc_main:
    host: localhost


###############################################################################
node:

  # ---------------------------------------------------------------------------
  # System clock and state management for the entire system.
  #
  system_controller:
    process:        proc_main
    req_host_cfg:   default_configuration
    functionality:
      py_module:    cl.core.ctrl.sys.ic00_edict
    state_type:     py_dict
    config:
      frequency_hz: 2
      idx_max:      1000

  # ---------------------------------------------------------------------------
  # State management for the main process.
  #
  main_process_controller:
    process:        proc_main
    req_host_cfg:   default_configuration
    functionality:
      py_module:    cl.core.ctrl.proc.ic00_edict
    state_type:     py_dict

  # ---------------------------------------------------------------------------
  # Parameter generator.
  #
  genparams:
    process:        proc_main
    req_host_cfg:   default_configuration
    functionality:
      py_module:    forever.narrative.parameter_generator
    state_type:     py_dict

  # ---------------------------------------------------------------------------
  # Workflow engine.
  #
  engine:
    process:        proc_main
    req_host_cfg:   default_configuration
    functionality:
      py_module:    cl.net.openai.workflow.ic00_edict
    state_type:     py_dict

  # ---------------------------------------------------------------------------
  # OpenAI client.
  #
  client:
    process:         proc_main
    req_host_cfg:    default_configuration
    functionality:
      py_module:     cl.net.openai.client.ic00_edict
    state_type:      py_dict
    config:
      filepath_env:  Null
      envvar_key:    OPENAI_API_KEY
      secs_interval: 0.1
      default:
        model:             'gpt-3.5-turbo'
        temperature:       1
        n:                 1
        stream:            False
        presence_penalty:  0
        frequency_penalty: 0
        user:              ''

  # ---------------------------------------------------------------------------
  # Resource server.
  #
  resource_server:
    process:        proc_main
    req_host_cfg:   default_configuration
    functionality:
      py_module:    cl.web.server
    state_type:     py_dict
    config:
      host:         0.0.0.0
      port:         8080
      session_key:  7A8F&+ey789dfgh+32d233shja67s843g1

  # ---------------------------------------------------------------------------
  # Server debug print.
  #
  server_debug_print:
    process:        proc_main
    req_host_cfg:   default_configuration
    functionality:
      py_module:    forever.narrative.server_debug_print
    state_type:     py_dict


###############################################################################
edge:

# -----------------------------------------------------------------------------
# Fan out from the system controller
# component to all of the process
# specific subsidiary controller
# components.
#

- owner: system_controller
  data:  py_dict
  src:   system_controller.outputs.control_main_process_controller
  dst:   main_process_controller.inputs.control

- owner: main_process_controller
  data:  py_dict
  src:   main_process_controller.outputs.control_filesystem_watcher
  dst:   genparams.inputs.control

- owner: genparams
  data:  py_dict
  src:   genparams.outputs.param
  dst:   engine.inputs.param

- owner: engine
  data:  py_dict
  src:   engine.outputs.template
  dst:   client.inputs.template

- owner: engine
  data:  py_dict
  src:   engine.outputs.param
  dst:   client.inputs.param

- owner: client
  data:  py_dict
  src:   client.outputs.result
  dst:   engine.inputs.result
  dirn:  feedback

- owner: client
  data:  py_dict
  src:   client.outputs.error
  dst:   engine.inputs.error
  dirn:  feedback

- owner: engine
  data:  py_dict
  src:   engine.outputs.resource
  dst:   resource_server.inputs.resource

- owner: resource_server
  data:  py_dict
  src:   resource_server.outputs.request
  dst:   server_debug_print.inputs.request


###############################################################################
data:
  py_list:  py_list
  py_dict:  py_dict
  py_str:   py_str


###############################################################################
req_host_cfg:
  default_configuration:
    role:
      - default_role


###############################################################################
role:
  default_role:
    tasks:
      - name: Update apt-get repo and cache
        become:        yes
        become_user:   root
        become_method: sudo
        apt:
          update_cache:     yes
          force_apt_get:    yes
          cache_valid_time: 3600
