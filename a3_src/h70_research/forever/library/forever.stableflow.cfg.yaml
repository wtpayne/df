system:
  id_system: dm004_legend


###############################################################################
host:
  localhost:
    hostname:        'localhost'
    acct_run:        'wtp'
    acct_provision:  'wtp'
    port_range:      '8090-9000'
    dirpath_log:     ''
    environment:     'e002_general_research'
    launch_cmd:      ''
    log_level:       'TRACE'


###############################################################################
process:
  proc_main:
    host: localhost


###############################################################################
node:

  # ---------------------------------------------------------------------------
  # System clock and state management for the entire system.
  #
  system_controller:
    process:        proc_main
    req_host_cfg:   default_configuration
    functionality:
      py_module:    cl.core.ctrl.sys.ic00_edict
    state_type:     py_dict
    config:
      frequency_hz: 0.5
      idx_max:      10000

  # ---------------------------------------------------------------------------
  # State management for the main process.
  #
  main_process_controller:
    process:        proc_main
    req_host_cfg:   default_configuration
    functionality:
      py_module:    cl.core.ctrl.proc.ic00_edict
    state_type:     py_dict

  # ---------------------------------------------------------------------------
  # Narrative engine.
  #
  narrative_engine:
    process:        proc_main
    req_host_cfg:   default_configuration
    functionality:
      py_module:    forever.narrative.engine
    state_type:     py_dict

  # ---------------------------------------------------------------------------
  # Resource server.
  #
  resource_server:
    process:        proc_main
    req_host_cfg:   default_configuration
    functionality:
      py_module:    cl.web.server
    state_type:     py_dict
    config:
      host:         0.0.0.0
      port:         8080
      session_key:  7A8F&+ey789dfgh+32d233shja67s843g1


###############################################################################
edge:

# -----------------------------------------------------------------------------
# Fan out from the system controller
# component to all of the process
# specific subsidiary controller
# components.
#

- owner: system_controller
  data:  py_dict
  src:   system_controller.outputs.control_main_process_controller
  dst:   main_process_controller.inputs.control

- owner: main_process_controller
  data:  py_dict
  src:   main_process_controller.outputs.control_filesystem_watcher
  dst:   narrative_engine.inputs.control

- owner: narrative_engine
  data:  py_dict
  src:   narrative_engine.outputs.res
  dst:   resource_server.inputs.res

###############################################################################
data:
  py_list:  py_list
  py_dict:  py_dict
  py_str:   py_str


###############################################################################
req_host_cfg:
  default_configuration:
    role:
      - default_role


###############################################################################
role:
  default_role:
    tasks:
      - name: Update apt-get repo and cache
        become:        yes
        become_user:   root
        become_method: sudo
        apt:
          update_cache:     yes
          force_apt_get:    yes
          cache_valid_time: 3600
