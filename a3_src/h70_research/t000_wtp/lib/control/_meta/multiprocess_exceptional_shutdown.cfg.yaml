system:
  id_system: multiprocess_exceptional_shutdown


###############################################################################
host:
  localhost:
    hostname:        'localhost'
    acct_run:        'wtp'
    acct_provision:  'wtp'
    port_range:      '8090-9000'
    dirpath_log:     '/var/log/xact'
    dirpath_install: '/home/wtp/dev/xact/'
    dirpath_venv:    '/home/wtp/dev/venv/'    # /opt/xact
    log_level:       'TRACE'


###############################################################################
process:
  proc_00:
    host: localhost


###############################################################################
node:

  ctrl_sys:
    process:        proc_00
    req_host_cfg:   default_configuration
    functionality:
      py_module:    xact.lib.control.system
    state_type:     py_dict
    config:
      idx_max:      10

  ctrl_proc_00:
    process:        proc_00
    req_host_cfg:   default_configuration
    functionality:
      py_module:    xact.lib.control.process
    state_type:     py_dict

  exception_thrower:
    process:        proc_00
    req_host_cfg:   default_configuration
    functionality:
      py_module:    xact.lib.control._meta.exception_thrower
    state_type:     py_dict
    config:
      idx_max:      5


###############################################################################
edge:

- owner: ctrl_sys
  data:  py_dict
  src:   ctrl_sys.outputs.ctrl_proc_00
  dst:   ctrl_proc_00.inputs.control

- owner: ctrl_proc_00
  data:  py_dict
  src:   ctrl_proc_00.outputs.feedback
  dst:   ctrl_sys.inputs.feedback_00
  dirn:  feedback

- owner: ctrl_proc_00
  data:  py_dict
  src:   ctrl_proc_00.outputs.exception_thrower
  dst:   exception_thrower.inputs.control


###############################################################################
data:
  py_dict:  py_dict
  py_str:   py_str


###############################################################################
req_host_cfg:
  default_configuration:
    role:
      - default_role


###############################################################################
role:
  default_role:
    tasks:
      - name: Update apt-get repo and cache
        become:        yes
        become_user:   root
        become_method: sudo
        apt:
          update_cache:     yes
          force_apt_get:    yes
          cache_valid_time: 3600
