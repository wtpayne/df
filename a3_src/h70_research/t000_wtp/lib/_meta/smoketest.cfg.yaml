system:
  id_system: bowyer_lib_smoketest


###############################################################################
host:
  localhost:
    hostname:        'localhost'
    acct_run:        'wtp'
    acct_provision:  'wtp'
    port_range:      '8090-9000'
    dirpath_log:     ''
    launch_script:   ''
    log_level:       'TRACE'


###############################################################################
process:
  main_process:
    host: localhost


###############################################################################
node:

  # ---------------------------------------------------------------------------
  system_controller:
    process:        main_process
    req_host_cfg:   default_configuration
    functionality:
      py_module:    bowyer.lib.control.system
    state_type:     py_dict
    config:
      frequency_hz: 10
      idx_max:      10

  # ---------------------------------------------------------------------------
  process_controller:
    process:        main_process
    req_host_cfg:   default_configuration
    functionality:
      py_module:    bowyer.lib.control.process
    state_type:     py_dict

  # ---------------------------------------------------------------------------
  diagnostic_printer:
    process:        main_process
    req_host_cfg:   default_configuration
    functionality:
      py_module:    bowyer.lib.util.printer
    state_type:     py_dict
    config:
      output:       stdout
      pretty:       false


###############################################################################
edge:
- owner: system_controller
  data:  py_dict
  src:   system_controller.outputs.control_00
  dst:   process_controller.inputs.control

- owner: process_controller
  data:  py_dict
  src:   process_controller.outputs.control_video_capture
  dst:   diagnostic_printer.inputs.control


###############################################################################
data:
  py_list:  py_list
  py_dict:  py_dict
  py_str:   py_str


###############################################################################
req_host_cfg:
  default_configuration:
    role:
      - default_role


###############################################################################
role:
  default_role:
    tasks:
      - name: Update apt-get repo and cache
        become:        yes
        become_user:   root
        become_method: sudo
        apt:
          update_cache:     yes
          force_apt_get:    yes
          cache_valid_time: 3600
