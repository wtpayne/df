system:
  id_system: tetra


###############################################################################
host:
  localhost:
    hostname:        'localhost'
    acct_run:        'wtp'
    acct_provision:  'wtp'
    port_range:      '8090-9000'
    dirpath_log:     '/var/log/xact'
    dirpath_install: '/home/wtp/dev/xact/'
    dirpath_venv:    '/home/wtp/dev/venv/'    # /opt/xact
    log_level:       'TRACE'


###############################################################################
process:
  proc_00:
    host: localhost
  proc_01:
    host: localhost
  proc_02:
    host: localhost
  proc_03:
    host: localhost

###############################################################################
node:

  # ---------------------------------------------------------------------------
  # System and process controllers.
  #
  # These controller-actors handle things like
  # controlling the timing of system  actor
  # firings, clean shutdown, pausing, and other
  # global simulation state changes.
  #

  ctrl_sys:
    process:        proc_00
    req_host_cfg:   default_configuration
    functionality:
      py_module:    xact.lib.control.system
    state_type:     py_dict
    config:
      frequency_hz: 10
      idx_max:      10

  ctrl_proc_00:
    process:        proc_00
    req_host_cfg:   default_configuration
    functionality:
      py_module:    xact.lib.control.process
    state_type:     py_dict

  ctrl_proc_01:
    process:        proc_01
    req_host_cfg:   default_configuration
    functionality:
      py_module:    xact.lib.control.process
    state_type:     py_dict

  ctrl_proc_02:
    process:        proc_02
    req_host_cfg:   default_configuration
    functionality:
      py_module:    xact.lib.control.process
    state_type:     py_dict

  ctrl_proc_03:
    process:        proc_03
    req_host_cfg:   default_configuration
    functionality:
      py_module:    xact.lib.control.process
    state_type:     py_dict

  # ---------------------------------------------------------------------------
  # Simulation of the physical environment and
  # sensor hardware.
  #

  director:
    process:        proc_00
    req_host_cfg:   default_configuration
    functionality:
      py_module:    xact.app.tetra.director
    state_type:     py_dict

  asset_generator:
    process:        proc_00
    req_host_cfg:   default_configuration
    functionality:
      py_module:    xact.app.tetra.asset_generator
    state_type:     py_dict

  scene_graph_generator:
    process:        proc_00
    req_host_cfg:   default_configuration
    functionality:
      py_module:    xact.app.tetra.scene_graph_generator
    state_type:     py_dict

  renderer:
    process:        proc_00
    req_host_cfg:   default_configuration
    functionality:
      py_module:    xact.app.tetra.renderer
    state_type:     py_dict
    config:
      dirpath_res:  "/home/wtp/dev/"
      ais_00:
        range:      80.0
      camera_00:
        type:       fixed
        fov_min:    -30.0
        fov_max:    30.0
        range:      20.0
      radar_00:
        range:      60.0
      comms_00:
        range:      100.0

  # ---------------------------------------------------------------------------
  # Device IO adapters and low level processing logic.
  #

  ais_00:
    process:        proc_01
    req_host_cfg:   default_configuration
    functionality:
      py_module:    xact.app.tetra.ais
    state_type:     py_dict

  camera_00:
    process:        proc_01
    req_host_cfg:   default_configuration
    functionality:
      py_module:    xact.app.tetra.camera
    state_type:     py_dict

  radar_00:
    process:        proc_01
    req_host_cfg:   default_configuration
    functionality:
      py_module:    xact.app.tetra.radar
    state_type:     py_dict

  comms_00:
    process:        proc_01
    req_host_cfg:   default_configuration
    functionality:
      py_module:    xact.app.tetra.comms
    state_type:     py_dict

  # ---------------------------------------------------------------------------
  # Main data processing pipeline.
  #

  estimator:
    process:        proc_02
    req_host_cfg:   default_configuration
    functionality:
      py_module:    xact.app.tetra.estimator
    state_type:     py_dict

  mission:
    process:        proc_02
    req_host_cfg:   default_configuration
    functionality:
      py_module:    xact.app.tetra.mission
    state_type:     py_dict

  planner:
    process:        proc_02
    req_host_cfg:   default_configuration
    functionality:
      py_module:    xact.app.tetra.planner
    state_type:     py_dict

  actuator:
    process:        proc_02
    req_host_cfg:   default_configuration
    functionality:
      py_module:    xact.app.tetra.actuator
    state_type:     py_dict

  # ---------------------------------------------------------------------------
  # UI messaging.
  #

  service_host:
    process:        proc_02
    req_host_cfg:   default_configuration
    functionality:
      py_module:    xact.lib.service.host
    state_type:     py_dict
    config:
      service:
        - xact.app.tetra.app
        - xact.lib.service.filesystem

  broker:
    process:        proc_02
    req_host_cfg:   default_configuration
    functionality:
      py_module:    xact.lib.service.broker
    state_type:     py_dict
    config:
      do_validate:  True

  # ---------------------------------------------------------------------------
  # UI display
  #

  display_00:
    process:        proc_03
    req_host_cfg:   default_configuration
    functionality:
      # py_module:    xact.lib.util.noop
      py_module:    xact.lib.ui.imgui.service.display
    state_type:     py_dict
    config:
      id_screen:    0
      name:         TETRA
      width:        1024
      height:       768
      filepath_ttf: /media/wtp/Data/dev/Roboto/Roboto-Thin.ttf  # ATLAS
      font_size:    18
      env:
        # DISPLAY:    ':0'  # ATOMIC
        DISPLAY:    ':1'  # ATLAS
        XAUTHORITY: '/run/user/1001/gdm/Xauthority'


###############################################################################
edge:


  # ---------------------------------------------------------------------------
  # Control signals from the main system
  # controller to process controllers 00-03.
  #

- owner: ctrl_sys
  data:  py_dict
  src:   ctrl_sys.outputs.ctrl_proc_00
  dst:   ctrl_proc_00.inputs.control

- owner: ctrl_sys
  data:  py_dict
  src:   ctrl_sys.outputs.ctrl_proc_01
  dst:   ctrl_proc_01.inputs.control

- owner: ctrl_sys
  data:  py_dict
  src:   ctrl_sys.outputs.ctrl_proc_02
  dst:   ctrl_proc_02.inputs.control

- owner: ctrl_sys
  data:  py_dict
  src:   ctrl_sys.outputs.ctrl_proc_03
  dst:   ctrl_proc_03.inputs.control


  # ---------------------------------------------------------------------------
  # Feedback signals from process controllers
  # 00-03 to the main system controller.
  #

- owner: ctrl_proc_00
  data:  py_dict
  src:   ctrl_proc_00.outputs.feedback
  dst:   ctrl_sys.inputs.feedback_00
  dirn:  feedback

- owner: ctrl_proc_01
  data:  py_dict
  src:   ctrl_proc_01.outputs.feedback
  dst:   ctrl_sys.inputs.feedback_01
  dirn:  feedback

- owner: ctrl_proc_02
  data:  py_dict
  src:   ctrl_proc_02.outputs.feedback
  dst:   ctrl_sys.inputs.feedback_02
  dirn:  feedback

- owner: ctrl_proc_03
  data:  py_dict
  src:   ctrl_proc_03.outputs.feedback
  dst:   ctrl_sys.inputs.feedback_03
  dirn:  feedback


  # ---------------------------------------------------------------------------
  # Control signals from process controller 00
  # to the computational actors responsible for
  # simulating the physical environment.
  #

- owner: ctrl_proc_00
  data:  py_dict
  src:   ctrl_proc_00.outputs.director
  dst:   director.inputs.control

- owner: ctrl_proc_00
  data:  py_dict
  src:   ctrl_proc_00.outputs.asset_generator
  dst:   asset_generator.inputs.control

- owner: ctrl_proc_00
  data:  py_dict
  src:   ctrl_proc_00.outputs.scene_graph_generator
  dst:   scene_graph_generator.inputs.control

- owner: ctrl_proc_00
  data:  py_dict
  src:   ctrl_proc_00.outputs.renderer
  dst:   renderer.inputs.control


  # ---------------------------------------------------------------------------
  # Control signals to the device IO adapters.
  #

- owner: ctrl_proc_01
  data:  py_dict
  src:   ctrl_proc_01.outputs.ais_00
  dst:   ais_00.inputs.control

- owner: ctrl_proc_01
  data:  py_dict
  src:   ctrl_proc_01.outputs.camera_00
  dst:   camera_00.inputs.control

- owner: ctrl_proc_01
  data:  py_dict
  src:   ctrl_proc_01.outputs.radar_00
  dst:   radar_00.inputs.control

- owner: ctrl_proc_01
  data:  py_dict
  src:   ctrl_proc_01.outputs.comms_00
  dst:   comms_00.inputs.control


  # ---------------------------------------------------------------------------
  # Control signals to the main data processing
  # pipeline.
  #

- owner: ctrl_proc_01
  data:  py_dict
  src:   ctrl_proc_01.outputs.estimator
  dst:   estimator.inputs.control

- owner: ctrl_proc_01
  data:  py_dict
  src:   ctrl_proc_01.outputs.mission
  dst:   mission.inputs.control

- owner: ctrl_proc_01
  data:  py_dict
  src:   ctrl_proc_01.outputs.planner
  dst:   planner.inputs.control

- owner: ctrl_proc_01
  data:  py_dict
  src:   ctrl_proc_01.outputs.actuator
  dst:   actuator.inputs.control


  # ---------------------------------------------------------------------------
  # Control signals from process controller 02
  # to the computational actors responsible for
  # running the messaging and service logic.
  #

- owner: ctrl_proc_02
  data:  py_dict
  src:   ctrl_proc_02.outputs.service_host
  dst:   service_host.inputs.control

- owner: ctrl_proc_02
  data:  py_dict
  src:   ctrl_proc_02.outputs.broker
  dst:   broker.inputs.control

  # ---------------------------------------------------------------------------
  # Control signals from process controller 03
  # to the computational actors responsible for
  # running the user interface / display.
  #

- owner: ctrl_proc_03
  data:  py_dict
  src:   ctrl_proc_03.outputs.display_00
  dst:   display_00.inputs.control


  # ---------------------------------------------------------------------------
  # Simulation of the physical environment.
  #

- owner: director
  data:  py_dict
  src:   director.outputs.asset_direction
  dst:   asset_generator.inputs.asset_direction

- owner: director
  data:  py_dict
  src:   director.outputs.scene_graph_direction
  dst:   scene_graph_generator.inputs.scene_graph_direction

- owner: director
  data:  py_dict
  src:   director.outputs.rendering_direction
  dst:   renderer.inputs.rendering_direction

- owner: asset_generator
  data:  py_dict
  src:   asset_generator.outputs.asset_data
  dst:   scene_graph_generator.inputs.asset_data

- owner: scene_graph_generator
  data:  py_dict
  src:   scene_graph_generator.outputs.scene_graph
  dst:   renderer.inputs.scene_graph


  # ---------------------------------------------------------------------------
  # Simulation of the physical environment to
  # device IO adapters.
  #

- owner: renderer
  data:  py_dict
  src:   renderer.outputs.ais_00
  dst:   ais_00.inputs.ais

- owner: renderer
  data:  py_dict
  src:   renderer.outputs.camera_00
  dst:   camera_00.inputs.ais

- owner: renderer
  data:  py_dict
  src:   renderer.outputs.radar_00
  dst:   radar_00.inputs.ais

- owner: renderer
  data:  py_dict
  src:   renderer.outputs.comms_00
  dst:   comms_00.inputs.ais


  # ---------------------------------------------------------------------------
  # Device IO adapters to the main sensor data
  # processing pipeline.
  #

- owner: ais_00
  data:  py_dict
  src:   ais_00.outputs.object
  dst:   estimator.inputs.ais_00

- owner: camera_00
  data:  py_dict
  src:   camera_00.outputs.object
  dst:   estimator.inputs.camera_00

- owner: radar_00
  data:  py_dict
  src:   radar_00.outputs.object
  dst:   estimator.inputs.radar_00

- owner: comms_00
  data:  py_dict
  src:   comms_00.outputs.object
  dst:   estimator.inputs.comms_00


  # ---------------------------------------------------------------------------
  # Main sensor data processing pipeline.
  #

- owner: estimator
  data:  py_dict
  src:   estimator.outputs.object
  dst:   planner.inputs.object

- owner: mission
  data:  py_dict
  src:   mission.outputs.objective
  dst:   planner.inputs.objective

- owner: planner
  data:  py_dict
  src:   planner.outputs.task
  dst:   actuator.inputs.object


  # ---------------------------------------------------------------------------
  # Device IO adapter service messages.
  #

- owner: service_host
  data:  py_dict
  src:   ais_00.outputs.diagnostics
  dst:   service_host.inputs.ais_00

- owner: service_host
  data:  py_dict
  src:   camera_00.outputs.diagnostics
  dst:   service_host.inputs.camera_00

- owner: service_host
  data:  py_dict
  src:   radar_00.outputs.diagnostics
  dst:   service_host.inputs.radar_00

- owner: service_host
  data:  py_dict
  src:   comms_00.outputs.diagnostics
  dst:   service_host.inputs.comms_00


  # ---------------------------------------------------------------------------
  # Main sensor data processing service messages.
  #

- owner: service_host
  data:  py_dict
  src:   estimator.outputs.diagnostics
  dst:   service_host.inputs.estimator

- owner: service_host
  data:  py_dict
  src:   planner.outputs.diagnostics
  dst:   service_host.inputs.planner

- owner: service_host
  data:  py_dict
  src:   actuator.outputs.diagnostics
  dst:   service_host.inputs.actuator

  # ---------------------------------------------------------------------------
  # Feedback from actuator to environemnt model.

- owner: actuator
  data:  py_dict
  src:   actuator.outputs.platform_control
  dst:   director.inputs.platform_control
  dirn:  feedback

  # ---------------------------------------------------------------------------
  # Service brokerage.
  #

- owner: broker
  data:  py_dict
  src:   service_host.outputs.broker
  dst:   broker.inputs.service_host

- owner: broker
  data:  py_dict
  src:   broker.outputs.service_host
  dst:   service_host.inputs.broker
  dirn:  feedback

- owner: broker
  data:  py_dict
  src:   broker.outputs.display_00
  dst:   display_00.inputs.broker

- owner: broker
  data:  py_dict
  src:   display_00.outputs.broker
  dst:   broker.inputs.display_00
  dirn:  feedback


###############################################################################
data:
  py_dict:  py_dict
  py_str:   py_str


###############################################################################
req_host_cfg:
  default_configuration:
    role:
      - default_role


###############################################################################
role:
  default_role:
    tasks:
      - name: Update apt-get repo and cache
        become:        yes
        become_user:   root
        become_method: sudo
        apt:
          update_cache:     yes
          force_apt_get:    yes
          cache_valid_time: 3600
