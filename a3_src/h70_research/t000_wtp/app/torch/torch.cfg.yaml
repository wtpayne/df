system:
  id_system: torch


###############################################################################
host:
  localhost:
    hostname:        'localhost'
    acct_run:        'wtp'
    acct_provision:  'wtp'
    port_range:      '8090-9000'
    dirpath_log:     '/var/log/xact'
    dirpath_install: '/home/wtp/dev/xact/'
    dirpath_venv:    '/home/wtp/dev/venv/'    # /opt/xact
    log_level:       'TRACE'


###############################################################################
process:
  proc_01:
    host: localhost


###############################################################################
node:

  # ---------------------------------------------------------------------------
  ctrl_sys:
    process:        proc_01
    req_host_cfg:   default_configuration
    functionality:
      py_module:    xact.lib.control.system
    state_type:     py_dict
    config:
      frequency_hz:        10
      lateness_max_cycles: 0.5

  # ---------------------------------------------------------------------------
  loader:
    process:        proc_01
    req_host_cfg:   default_configuration
    functionality:
      py_module:    xact.lib.torch.data_loader
    state_type:     py_dict
    config:
      seed:         1

  # ---------------------------------------------------------------------------
  # render:
  #   process:        proc_01
  #   req_host_cfg:   default_configuration
  #   functionality:
  #     py_module:    xact.lib.synth.pygame
  #   state_type:     py_dict
  #   config:
  #     headless: True
  #     width:    256
  #     height:   256

  # ---------------------------------------------------------------------------
  debug_print:
    process:        proc_01
    req_host_cfg:   default_configuration
    functionality:
      py_module:    xact.lib.util.printer
    state_type:     py_dict
    config:
      pretty: True


###############################################################################
edge:
- owner: ctrl_sys
  data:  py_dict
  src:   ctrl_sys.outputs.control
  dst:   loader.inputs.control

- owner: loader
  data:  py_dict
  src:   loader.outputs.foo
  dst:   debug_print.inputs.foo


###############################################################################
data:
  py_dict:  py_dict
  py_str:   py_str


###############################################################################
req_host_cfg:
  default_configuration:
    role:
      - default_role


###############################################################################
role:
  default_role:
    tasks:
      - name: Update apt-get repo and cache
        become:        yes
        become_user:   root
        become_method: sudo
        apt:
          update_cache:     yes
          force_apt_get:    yes
          cache_valid_time: 3600
