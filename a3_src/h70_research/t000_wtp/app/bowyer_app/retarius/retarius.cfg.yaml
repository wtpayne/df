system:
  id_system: retarius


###############################################################################
host:
  localhost:
    hostname:        'localhost'
    acct_run:        'wtp'
    acct_provision:  'wtp'
    port_range:      '8090-9000'
    dirpath_log:     ''
    launch_script:   ''
    log_level:       'TRACE'


###############################################################################
process:
  main_process:
    host: localhost


###############################################################################
node:

  # ---------------------------------------------------------------------------
  ctrl_sys:
    process:        main_process
    req_host_cfg:   default_configuration
    functionality:
      py_module:    bowyer.lib.control.system
    state_type:     py_dict
    config:
      frequency_hz: 0.5

  # ---------------------------------------------------------------------------
  ctrl_proc_00:
    process:        main_process
    req_host_cfg:   default_configuration
    functionality:
      py_module:    bowyer.lib.control.process
    state_type:     py_dict

  # ---------------------------------------------------------------------------
  loader:
    process:        main_process
    req_host_cfg:   default_configuration
    functionality:
      py_module:    bowyer.app.retarius.segmentation_model_loader
    state_type:     py_dict
    config:
      filepath:     '/media/wtp/Data/dev/bowyer_lib/src/bowyer/app/retarius/cocostuff27_vit_base_5.ckpt'


  # ---------------------------------------------------------------------------
  vid_cap:
    process:        main_process
    req_host_cfg:   default_configuration
    functionality:
      py_module:    bowyer.lib.video.capture
    state_type:     py_dict
    config:
      connection:   0
      cam_width:    1280
      cam_height:   720
      out_width:    640
      out_height:   360
      framerate:    10
      flip_method:  0

  # ---------------------------------------------------------------------------
  inference:
    process:        main_process
    req_host_cfg:   default_configuration
    functionality:
      py_module:    bowyer.app.retarius.segmentation_inference
    state_type:     py_dict

  # ---------------------------------------------------------------------------
  vid_disp:
    process:        main_process
    req_host_cfg:   default_configuration
    functionality:
      py_module:    bowyer.lib.video.display
    state_type:     py_dict
    config:
      window_name:  retarius

  # ---------------------------------------------------------------------------
  # diagnostic_printer:
  #   process:        main_process
  #   req_host_cfg:   default_configuration
  #   functionality:
  #     py_module:    bowyer.lib.util.printer
  #   state_type:     py_dict
  #   config:
  #     output:       stdout
  #     path:
  #       - img.ts_rel_us


###############################################################################
edge:

# Control net.

- owner: ctrl_sys
  data:  py_dict
  src:   ctrl_sys.outputs.control_00
  dst:   ctrl_proc_00.inputs.control

- owner: ctrl_proc_00
  data:  py_dict
  src:   ctrl_proc_00.outputs.ctrl_loader
  dst:   loader.inputs.control

- owner: ctrl_proc_00
  data:  py_dict
  src:   ctrl_proc_00.outputs.ctrl_vidcap
  dst:   vid_cap.inputs.control

# Video and NN inference pipelines

- owner: loader
  data:  py_dict
  src:   loader.outputs.model
  dst:   inference.inputs.model

- owner: vid_cap
  data:  py_dict
  src:   vid_cap.outputs.img
  dst:   inference.inputs.sample

- owner: inference
  data:  py_dict
  src:   inference.outputs.result
  dst:   vid_disp.inputs.img

###############################################################################
data:
  py_list:  py_list
  py_dict:  py_dict
  py_str:   py_str


###############################################################################
req_host_cfg:
  default_configuration:
    role:
      - default_role


###############################################################################
role:
  default_role:
    tasks:
      - name: Update apt-get repo and cache
        become:        yes
        become_user:   root
        become_method: sudo
        apt:
          update_cache:     yes
          force_apt_get:    yes
          cache_valid_time: 3600
