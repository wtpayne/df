system:
  id_system: durga


###############################################################################
host:
  localhost:
    hostname:        'localhost'
    acct_run:        'wtp'
    acct_provision:  'wtp'
    port_range:      '8090-9000'
    dirpath_log:     ''
    launch_script:   ''
    log_level:       'TRACE'


###############################################################################
process:
  proc_main:
    host: localhost


###############################################################################
node:

  # ---------------------------------------------------------------------------
  ctrl_sys:
    process:        proc_main
    req_host_cfg:   default_configuration
    functionality:
      py_module:    bowyer.lib.control.system
    state_type:     py_dict
    config:
      frequency_hz: 600
      # idx_max:      60000

  # ---------------------------------------------------------------------------
  ctrl_proc_main:
    process:        proc_main
    req_host_cfg:   default_configuration
    functionality:
      py_module:    bowyer.lib.control.process
    state_type:     py_dict

  # ---------------------------------------------------------------------------
  vid_cap:
    process:        proc_main
    req_host_cfg:   default_configuration
    functionality:
      py_module:    bowyer.lib.video.capture
    state_type:     py_dict
    config:
      connection:   0
      cam_width:    1280
      cam_height:   720
      out_width:    320
      out_height:   200
      framerate:    60
      flip_method:  0

  # ---------------------------------------------------------------------------
  pose_inference:
    process:        proc_main
    req_host_cfg:   default_configuration
    functionality:
      py_module:    bowyer.lib.util.live_reload
    state_type:     py_dict
    config:
      py_module:    bowyer.app.durga.pose_inference

  # ---------------------------------------------------------------------------
  debug_print_pose:
    process:        proc_main
    req_host_cfg:   default_configuration
    functionality:
      py_module:    bowyer.lib.util.printer
    state_type:     py_dict
    config:
      output:       stdout
      pretty:       true

  # ---------------------------------------------------------------------------
  # mobile_ui:
  #   process:        proc_main
  #   req_host_cfg:   default_configuration
  #   functionality:
  #     py_module:    bowyer.lib.util.live_reload
  #   state_type:     py_dict
  #   config:
  #     py_module:    bowyer.app.durga.mobile.ui

  # ---------------------------------------------------------------------------
  debug_display:
    process:        proc_main
    req_host_cfg:   default_configuration
    functionality:
      py_module:    bowyer.lib.video.display
    state_type:     py_dict
    config:
      window_name:  durga

  # ---------------------------------------------------------------------------
  static_files:
    process:        proc_main
    req_host_cfg:   default_configuration
    functionality:
      py_module:    bowyer.lib.ui.web.resource_from_file
    state_type:     py_dict
    config:
      list:
      - id_resource:  _hyperscript_web.min.js
        media_type:   text/javascript
        is_binary:    false
        filepath:     /media/wtp/Data/dev/bowyer_lib/src/bowyer/app/vrcam/static/_hyperscript/0.9.5/_hyperscript_web.min.js
      - id_resource:  _hyperscript_web.min.js.map
        media_type:   text/javascript
        is_binary:    false
        filepath:     /media/wtp/Data/dev/bowyer_lib/src/bowyer/app/vrcam/static/_hyperscript/0.9.5/_hyperscript_web.min.js.map
      - id_resource:  htmx.js
        media_type:   text/javascript
        is_binary:    false
        filepath:     /media/wtp/Data/dev/bowyer_lib/src/bowyer/app/vrcam/static/htmx/1.7.0/htmx.js
      - id_resource:  sse.js
        media_type:   text/javascript
        is_binary:    false
        filepath:     /media/wtp/Data/dev/bowyer_lib/src/bowyer/app/vrcam/static/htmx/1.7.0_mod_01/sse.js
      - id_resource:  tecnicofino
        media_type:   font/woff2
        is_binary:    true
        filepath:     /media/wtp/Data/dev/bowyer_lib/src/bowyer/app/vrcam/static/tecnico.fino-webfont.woff2

  # ---------------------------------------------------------------------------
  video_display:
    process:        proc_main
    req_host_cfg:   default_configuration
    functionality:
      py_module:    bowyer.lib.util.live_reload
    state_type:     py_dict
    config:
      py_module:    bowyer.app.durga.widget.vidfeed
      format:       webp

  # ---------------------------------------------------------------------------
  web_ui:
    process:        proc_main
    req_host_cfg:   default_configuration
    functionality:
      py_module:    bowyer.lib.util.live_reload
    state_type:     py_dict
    config:
      py_module:    bowyer.app.durga.ui

  # ---------------------------------------------------------------------------
  asgi:
    process:        proc_main
    req_host_cfg:   default_configuration
    functionality:
      py_module:    bowyer.lib.web.server
    state_type:     py_dict
    config:
      host:         0.0.0.0
      port:         8080
      session_key:  7A8F&+ey789dfgh+32d233shja67s843g1
      debug:        False
      ssl_keyfile:  /media/wtp/Data/dev/bowyer_lib/src/bowyer/app/chart_demo/key.pem
      ssl_certfile: /media/wtp/Data/dev/bowyer_lib/src/bowyer/app/chart_demo/server.pem


###############################################################################
edge:

# Control net - root

- owner: ctrl_sys
  data:  py_dict
  src:   ctrl_sys.outputs.control_00
  dst:   ctrl_proc_main.inputs.control

# Control net - main process

- owner: ctrl_proc_main
  data:  py_dict
  src:   ctrl_proc_main.outputs.ctrl_vidcap
  dst:   vid_cap.inputs.control

- owner: ctrl_proc_main
  data:  py_dict
  src:   ctrl_proc_main.outputs.ctrl_static_files
  dst:   static_files.inputs.control

# - owner: ctrl_proc_main
#   data:  py_dict
#   src:   ctrl_proc_main.outputs.ctrl_mobile_ui
#   dst:   mobile_ui.inputs.control

# Video pipeline - pose inference

- owner: vid_cap
  data:  py_dict
  src:   vid_cap.outputs.img_pose
  dst:   pose_inference.inputs.img

- owner: pose_inference
  data:  py_dict
  src:   pose_inference.outputs.pose
  dst:   debug_print_pose.inputs.pose

# Video pipeline - debug view

- owner: vid_cap
  data:  py_dict
  src:   vid_cap.outputs.debug
  dst:   debug_display.inputs.img

# Video pipeline - main process

- owner: vid_cap
  data:  py_dict
  src:   vid_cap.outputs.img_00
  dst:   video_display.inputs.img

# UI component sync/coordination data to web_ui

- owner: video_display
  data:  py_dict
  src:   video_display.outputs.uidata
  dst:   web_ui.inputs.video_display

# UI component web resources to ASGI server

- owner: video_display
  data:  py_dict
  src:   video_display.outputs.resources
  dst:   asgi.inputs.video_display

- owner: web_ui
  data:  py_dict
  src:   web_ui.outputs.resources
  dst:   asgi.inputs.web_ui

- owner: static_files
  data:  py_dict
  src:   static_files.outputs.resources
  dst:   asgi.inputs.static_files


###############################################################################
data:
  py_list:  py_list
  py_dict:  py_dict
  py_str:   py_str


###############################################################################
req_host_cfg:
  default_configuration:
    role:
      - default_role


###############################################################################
role:
  default_role:
    tasks:
      - name: Update apt-get repo and cache
        become:        yes
        become_user:   root
        become_method: sudo
        apt:
          update_cache:     yes
          force_apt_get:    yes
          cache_valid_time: 3600
