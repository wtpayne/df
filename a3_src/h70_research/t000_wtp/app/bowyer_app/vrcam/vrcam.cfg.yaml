system:
  id_system: vrcam


###############################################################################
host:
  localhost:
    hostname:        'localhost'
    acct_run:        'wtp'
    acct_provision:  'wtp'
    port_range:      '8090-9000'
    dirpath_log:     ''
    launch_script:   ''
    log_level:       'TRACE'


###############################################################################
process:
  proc_main:
    host: localhost

  proc_dnn:
    host: localhost

###############################################################################
node:

  # ---------------------------------------------------------------------------
  ctrl_sys:
    process:        proc_main
    req_host_cfg:   default_configuration
    functionality:
      py_module:    bowyer.lib.control.system
    state_type:     py_dict
    config:
      frequency_hz: 30

  # ---------------------------------------------------------------------------
  ctrl_proc_main:
    process:        proc_main
    req_host_cfg:   default_configuration
    functionality:
      py_module:    bowyer.lib.control.process
    state_type:     py_dict

  # ---------------------------------------------------------------------------
  ctrl_proc_dnn:
    process:        proc_dnn
    req_host_cfg:   default_configuration
    functionality:
      py_module:    bowyer.lib.control.process
    state_type:     py_dict

  # ---------------------------------------------------------------------------
  vid_cap:
    process:        proc_main
    req_host_cfg:   default_configuration
    functionality:
      py_module:    bowyer.lib.video.capture
    state_type:     py_dict
    config:
      connection:   0
      cam_width:    1280
      cam_height:   720
      out_width:    640
      out_height:   480
      framerate:    30
      flip_method:  0

  # ---------------------------------------------------------------------------
  encoder:
    process:        proc_main
    req_host_cfg:   default_configuration
    functionality:
      py_module:    bowyer.lib.web.image_encoder
    state_type:     py_dict
    config:
      format:       jpeg

  # ---------------------------------------------------------------------------
  static_files:
    process:        proc_main
    req_host_cfg:   default_configuration
    functionality:
      py_module:    bowyer.lib.ui.web.resource_from_file
    state_type:     py_dict
    config:
      list:
      - id_resource:  aframe.min.js
        media_type:   text/javascript
        is_binary:    false
        filepath:     /media/wtp/Data/dev/bowyer_lib/src/bowyer/app/vrcam/static/aframe/1.3.0/aframe.min.js
      - id_resource:  aframe.min.js.map
        media_type:   text/javascript
        is_binary:    false
        filepath:     /media/wtp/Data/dev/bowyer_lib/src/bowyer/app/vrcam/static/aframe/1.3.0/aframe.min.js.map
      - id_resource:  aframe_extras.min.js
        media_type:   text/javascript
        is_binary:    false
        filepath:     /media/wtp/Data/dev/bowyer_lib/src/bowyer/app/vrcam/static/aframe_extras/v6.1.1/aframe_extras.min.js
      # - id_resource:  aframe_extras.misc.min.js
      #   media_type:   text/javascript
      #   is_binary:    false
      #   filepath:     /media/wtp/Data/dev/bowyer_lib/src/bowyer/app/vrcam/static/aframe_extras/v6.1.1/aframe_extras.misc.min.js
      - id_resource:  super_hands.js
        media_type:   text/javascript
        is_binary:    false
        filepath:     /media/wtp/Data/dev/bowyer_lib/src/bowyer/app/vrcam/static/super_hands/v3.0.3_mod/super_hands.js
      - id_resource:  _hyperscript_web.min.js
        media_type:   text/javascript
        is_binary:    false
        filepath:     /media/wtp/Data/dev/bowyer_lib/src/bowyer/app/vrcam/static/_hyperscript/0.9.5/_hyperscript_web.min.js
      - id_resource:  _hyperscript_web.min.js.map
        media_type:   text/javascript
        is_binary:    false
        filepath:     /media/wtp/Data/dev/bowyer_lib/src/bowyer/app/vrcam/static/_hyperscript/0.9.5/_hyperscript_web.min.js.map
      - id_resource:  htmx.js
        media_type:   text/javascript
        is_binary:    false
        filepath:     /media/wtp/Data/dev/bowyer_lib/src/bowyer/app/vrcam/static/htmx/1.7.0/htmx.js
      - id_resource:  sse.js
        media_type:   text/javascript
        is_binary:    false
        filepath:     /media/wtp/Data/dev/bowyer_lib/src/bowyer/app/vrcam/static/htmx/1.7.0_mod_01/sse.js
      - id_resource:  tecnicofino
        media_type:   font/woff2
        is_binary:    true
        filepath:     /media/wtp/Data/dev/bowyer_lib/src/bowyer/app/vrcam/static/tecnico.fino-webfont.woff2
      - id_resource:  vrcam.js
        media_type:   text/javascript
        is_binary:    false
        filepath:     /media/wtp/Data/dev/bowyer_lib/src/bowyer/app/vrcam/vrcam.js
        # VEGA LITE
        # html.script(type = 'text/javascript',
        #             src  = 'https://cdn.jsdelivr.net/npm/vega@5')
        # html.script(type = 'text/javascript',
        #             src  = 'https://cdn.jsdelivr.net/npm/vega-lite@4')
        # html.script(type = 'text/javascript',
        #             src  = 'https://cdn.jsdelivr.net/npm/vega-embed@6')

        # html.script(type  = 'text/javascript',
        #             src   = "https://d3js.org/d3.v6.min.js")

  # ---------------------------------------------------------------------------
  ui:
    process:        proc_main
    req_host_cfg:   default_configuration
    functionality:
      py_module:    bowyer.lib.util.live_reload
    state_type:     py_dict
    config:
      py_module:    bowyer.app.vrcam.ui

  # ---------------------------------------------------------------------------
  asgi:
    process:        proc_main
    req_host_cfg:   default_configuration
    functionality:
      py_module:    bowyer.lib.web.server
    state_type:     py_dict
    config:
      host:         0.0.0.0
      port:         8080
      session_key:  7A8F&+ey789dfgh+32d233shja67s843g1
      debug:        False
      ssl_keyfile:  /media/wtp/Data/dev/vroom/key.pem
      ssl_certfile: /media/wtp/Data/dev/vroom/server.pem

  # ---------------------------------------------------------------------------
  loader:
    process:        proc_dnn
    req_host_cfg:   default_configuration
    functionality:
      py_module:    bowyer.app.retarius.segmentation_model_loader
    state_type:     py_dict
    config:
      filepath:     '/media/wtp/Data/dev/bowyer_lib/src/bowyer/app/retarius/cocostuff27_vit_base_5.ckpt'

  # ---------------------------------------------------------------------------
  inference:
    process:        proc_dnn
    req_host_cfg:   default_configuration
    functionality:
      py_module:    bowyer.app.retarius.segmentation_inference
    state_type:     py_dict

  # ---------------------------------------------------------------------------
  vid_disp:
    process:        proc_dnn
    req_host_cfg:   default_configuration
    functionality:
      py_module:    bowyer.lib.video.display
    state_type:     py_dict
    config:
      window_name:  retarius


###############################################################################
edge:

# Control net - root

- owner: ctrl_sys
  data:  py_dict
  src:   ctrl_sys.outputs.control_00
  dst:   ctrl_proc_main.inputs.control

- owner: ctrl_sys
  data:  py_dict
  src:   ctrl_sys.outputs.control_01
  dst:   ctrl_proc_dnn.inputs.control

# Control net - main process

- owner: ctrl_proc_main
  data:  py_dict
  src:   ctrl_proc_main.outputs.ctrl_vidcap
  dst:   vid_cap.inputs.control

- owner: ctrl_proc_main
  data:  py_dict
  src:   ctrl_proc_main.outputs.ctrl_ui
  dst:   ui.inputs.control

- owner: ctrl_proc_main
  data:  py_dict
  src:   ctrl_proc_main.outputs.ctrl_static_files
  dst:   static_files.inputs.control

# Control net - dnn process

- owner: ctrl_proc_dnn
  data:  py_dict
  src:   ctrl_proc_dnn.outputs.ctrl_loader
  dst:   loader.inputs.control

- owner: ctrl_proc_dnn
  data:  py_dict
  src:   ctrl_proc_dnn.outputs.ctrl_vidcap
  dst:   inference.inputs.control

# Video pipeline - main process

- owner: vid_cap
  data:  py_dict
  src:   vid_cap.outputs.img_00
  dst:   encoder.inputs.img

- owner: encoder
  data:  py_dict
  src:   encoder.outputs.encoded
  dst:   asgi.inputs.images

# UI components

- owner: ui
  data:  py_dict
  src:   ui.outputs.ui
  dst:   asgi.inputs.ui

- owner: static_files
  data:  py_dict
  src:   static_files.outputs.resources
  dst:   asgi.inputs.static_files

# Video pipeline - DNN

- owner: loader
  data:  py_dict
  src:   loader.outputs.model
  dst:   inference.inputs.model

- owner: vid_cap
  data:  py_dict
  src:   vid_cap.outputs.img_01
  dst:   inference.inputs.sample

- owner: inference
  data:  py_dict
  src:   inference.outputs.result_00
  dst:   encoder.inputs.seg

- owner: inference
  data:  py_dict
  src:   inference.outputs.result_01
  dst:   vid_disp.inputs.img


###############################################################################
data:
  py_list:  py_list
  py_dict:  py_dict
  py_str:   py_str


###############################################################################
req_host_cfg:
  default_configuration:
    role:
      - default_role


###############################################################################
role:
  default_role:
    tasks:
      - name: Update apt-get repo and cache
        become:        yes
        become_user:   root
        become_method: sudo
        apt:
          update_cache:     yes
          force_apt_get:    yes
          cache_valid_time: 3600
