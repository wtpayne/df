system:
  id_system: sync_demo


###############################################################################
host:
  localhost:
    hostname:        'localhost'
    acct_run:        'wtp'
    acct_provision:  'wtp'
    port_range:      '8090-9000'
    dirpath_log:     ''
    launch_script:   'bowyer'
    log_level:       'TRACE'


###############################################################################
process:
  proc_main:
    host: localhost


###############################################################################
node:

  # ---------------------------------------------------------------------------
  ctrl_sys:
    process:        proc_main
    req_host_cfg:   default_configuration
    functionality:
      py_module:    bowyer.lib.control.system
    state_type:     py_dict
    config:
      frequency_hz: 0.5

  # ---------------------------------------------------------------------------
  ctrl_proc_main:
    process:        proc_main
    req_host_cfg:   default_configuration
    functionality:
      py_module:    bowyer.lib.control.process
    state_type:     py_dict

  # ---------------------------------------------------------------------------
  generator:
    process:        proc_main
    req_host_cfg:   default_configuration
    functionality:
      py_module:    bowyer.app.kvdemo.generator
    state_type:     py_dict

  # ---------------------------------------------------------------------------
  sync_a:
    process:        proc_main
    req_host_cfg:   default_configuration
    functionality:
      py_module:    bowyer.app.kvdemo.sync
    state_type:     py_dict

  # ---------------------------------------------------------------------------
  sync_b:
    process:        proc_main
    req_host_cfg:   default_configuration
    functionality:
      py_module:    bowyer.app.kvdemo.sync
    state_type:     py_dict

  # ---------------------------------------------------------------------------
  display:
    process:        proc_main
    req_host_cfg:   default_configuration
    functionality:
      py_module:    bowyer.app.kvdemo.display
    state_type:     py_dict


###############################################################################
edge:

# Control net - root.

- owner: ctrl_sys
  data:  py_dict
  src:   ctrl_sys.outputs.control_00
  dst:   ctrl_proc_main.inputs.control

# Control net - main process.

- owner: ctrl_proc_main
  data:  py_dict
  src:   ctrl_proc_main.outputs.ctrl_reader
  dst:   monitor.inputs.control

- owner: ctrl_proc_main
  data:  py_dict
  src:   ctrl_proc_main.outputs.ctrl_generator
  dst:   generator.inputs.control

# Main sync data processing pipeline.

- owner: generator
  data:  py_dict
  src:   generator.outputs.raw_data
  dst:   sync_in.inputs.raw_data

- owner: sync_a
  data:  py_dict
  src:   sync_a.outputs.compressed_data
  dst:   sync_b.inputs.compressed_data

- owner: sync_b
  data:  py_dict
  src:   sync_b.outputs.compressed_data
  dst:   sync_a.inputs.compressed_data
  dirn:  feedback

- owner: sync_b
  data:  py_dict
  src:   sync_b.outputs.raw_data
  dst:   display.inputs.raw_data


###############################################################################
data:
  py_list:  py_list
  py_dict:  py_dict
  py_str:   py_str


###############################################################################
req_host_cfg:
  default_configuration:
    role:
      - default_role


###############################################################################
role:
  default_role:
    tasks:
      - name: Update apt-get repo and cache
        become:        yes
        become_user:   root
        become_method: sudo
        apt:
          update_cache:     yes
          force_apt_get:    yes
          cache_valid_time: 3600
