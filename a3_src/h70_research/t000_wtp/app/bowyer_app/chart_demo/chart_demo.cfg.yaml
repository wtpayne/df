system:
  id_system: chart_demo


###############################################################################
host:
  localhost:
    hostname:        'localhost'
    acct_run:        'wtp'
    acct_provision:  'wtp'
    port_range:      '8090-9000'
    dirpath_log:     ''
    launch_script:   'bowyer'
    log_level:       'TRACE'


###############################################################################
process:
  proc_main:
    host: localhost


###############################################################################
node:

  # ---------------------------------------------------------------------------
  ctrl_sys:
    process:        proc_main
    req_host_cfg:   default_configuration
    functionality:
      py_module:    bowyer.lib.control.system
    state_type:     py_dict
    config:
      frequency_hz: 60
      idx_max:      5000

  # ---------------------------------------------------------------------------
  ctrl_proc_main:
    process:        proc_main
    req_host_cfg:   default_configuration
    functionality:
      py_module:    bowyer.lib.control.process
    state_type:     py_dict

  # ---------------------------------------------------------------------------
  map_generator:
    process:        proc_main
    req_host_cfg:   default_configuration
    functionality:
      py_module:    bowyer.lib.util.live_reload
    state_type:     py_dict
    config:
      py_module:    bowyer.lib.geo.raster.source

  # ---------------------------------------------------------------------------
  debug_display:
    process:        proc_main
    req_host_cfg:   default_configuration
    functionality:
      py_module:    bowyer.lib.video.display
    state_type:     py_dict
    config:
      window_name:  chart_demo

  # ---------------------------------------------------------------------------
  asgi:
    process:        proc_main
    req_host_cfg:   default_configuration
    functionality:
      py_module:    bowyer.lib.web.server
    state_type:     py_dict
    config:
      host:         0.0.0.0
      port:         8080
      session_key:  7A8F&+ey789dfgh+32d233shja67s843g1
      debug:        False
      ssl_keyfile:  /media/wtp/Data/dev/vroom/key.pem
      ssl_certfile: /media/wtp/Data/dev/vroom/server.pem


###############################################################################
edge:

# Control net - root

- owner: ctrl_sys
  data:  py_dict
  src:   ctrl_sys.outputs.control_00
  dst:   ctrl_proc_main.inputs.control

# Control net - main process

- owner: ctrl_proc_main
  data:  py_dict
  src:   ctrl_proc_main.outputs.ctrl_vidcap
  dst:   map_generator.inputs.control

# Video pipeline - debug view

- owner: map_generator
  data:  py_dict
  src:   map_generator.outputs.img
  dst:   debug_display.inputs.img


###############################################################################
data:
  py_list:  py_list
  py_dict:  py_dict
  py_str:   py_str


###############################################################################
req_host_cfg:
  default_configuration:
    role:
      - default_role


###############################################################################
role:
  default_role:
    tasks:
      - name: Update apt-get repo and cache
        become:        yes
        become_user:   root
        become_method: sudo
        apt:
          update_cache:     yes
          force_apt_get:    yes
          cache_valid_time: 3600
