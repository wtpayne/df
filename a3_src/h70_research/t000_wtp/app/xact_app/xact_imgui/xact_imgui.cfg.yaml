system:
  id_system: xact_imgui


###############################################################################
host:
  localhost:
    hostname:        'localhost'
    acct_run:        'wtp'
    acct_provision:  'wtp'
    port_range:      '8090-9000'
    dirpath_log:     '/var/log/xact'
    dirpath_install: '/home/wtp/dev/xact/'
    dirpath_venv:    '/home/wtp/dev/venv/'    # /opt/xact
    log_level:       'TRACE'


###############################################################################
process:
  proc_main:
    host: localhost



###############################################################################
node:

  # ---------------------------------------------------------------------------
  controller:
    process:        proc_main
    req_host_cfg:   default_configuration
    functionality:
      py_module:    xact.lib.control.system
    state_type:     py_dict
    config:
      frequency_hz: 100
      idx_max:      4000

  # ---------------------------------------------------------------------------
  service_host_00:
    process:        proc_main
    req_host_cfg:   default_configuration
    functionality:
      py_module:    xact.lib.service.host
    state_type:     py_dict
    config:
      service:
        - xact.app.xact_imgui.app
        - xact.lib.service.filesystem

  # ---------------------------------------------------------------------------
  broker:
    process:        proc_main
    req_host_cfg:   default_configuration
    functionality:
      py_module:    xact.lib.service.broker
    state_type:     py_dict
    config:
      do_validate:  True

  # ---------------------------------------------------------------------------
  display_00:
    process:        proc_main
    req_host_cfg:   default_configuration
    functionality:
      py_module:    xact.lib.ui.imgui.service.display
    state_type:     py_dict
    config:
      id_screen:    0
      name:         xact demo - [00]
      width:        1024
      height:       768
      filepath_ttf: /media/wtp/Data/dev/Roboto/Roboto-Thin.ttf
      font_size:    18
      env:
        DISPLAY:    ':1'
        XAUTHORITY: '/run/user/1001/gdm/Xauthority'

  # ---------------------------------------------------------------------------
  # display_00:
  #   process:        proc_main
  #   req_host_cfg:   default_configuration
  #   functionality:
  #     py_module:    xact.lib.ui.imgui.window
  #   state_type:     py_dict
  #   config:
  #     name:         Display 01
  #     width:        1024
  #     height:       768
  #     env:
  #       DISPLAY:    ':1'
  #       XAUTHORITY: '/run/user/1001/gdm/Xauthority'


###############################################################################
edge:
- owner: controller
  data:  py_dict
  src:   controller.outputs.control_01
  dst:   service_host_00.inputs.control

- owner: controller
  data:  py_dict
  src:   controller.outputs.control_02
  dst:   broker.inputs.control

- owner: controller
  data:  py_dict
  src:   controller.outputs.control_03
  dst:   display_00.inputs.control

- owner: service_host_00
  data:  py_dict
  src:   service_host_00.outputs.broker
  dst:   broker.inputs.service_host_00

- owner: service_host_00
  data:  py_dict
  src:   broker.outputs.service_host_00
  dst:   service_host_00.inputs.broker

- owner: display_00
  data:  py_dict
  src:   display_00.outputs.broker
  dst:   broker.inputs.display_00

- owner: display_00
  data:  py_dict
  src:   broker.outputs.display_00
  dst:   display_00.inputs.broker

# - owner: app
#   data:  py_dict
#   src:   app.outputs.display_00
#   dst:   display_00.inputs.app

# - owner: app
#   data:  py_dict
#   src:   display_00.outputs.app
#   dst:   app.inputs.display_00
#   dirn:  feedback


###############################################################################
data:
  py_dict:  py_dict
  py_str:   py_str


###############################################################################
req_host_cfg:
  default_configuration:
    role:
      - default_role


###############################################################################
role:
  default_role:
    tasks:
      - name: Update apt-get repo and cache
        become:        yes
        become_user:   root
        become_method: sudo
        apt:
          update_cache:     yes
          force_apt_get:    yes
          cache_valid_time: 3600
