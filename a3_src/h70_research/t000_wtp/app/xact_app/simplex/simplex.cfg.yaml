system:
  id_system: simplex


###############################################################################
host:
  localhost:
    hostname:        'localhost'
    acct_run:        'wtp'
    acct_provision:  'wtp'
    port_range:      '8090-9000'
    dirpath_log:     '/var/log/xact'
    dirpath_install: '/home/wtp/dev/xact/'
    dirpath_venv:    '/home/wtp/dev/venv/'    # /opt/xact
    log_level:       'TRACE'


###############################################################################
process:
  master_process:
    host: localhost
  worker_process_00:
    host: localhost
  worker_process_01:
    host: localhost
  worker_process_02:
    host: localhost


###############################################################################
node:

  # ---------------------------------------------------------------------------
  system_controller:
    process:        master_process
    req_host_cfg:   default_configuration
    functionality:
      py_module:    xact.lib.control.system
    state_type:     py_dict
    config:
      frequency_hz: 1000
      idx_max:      5

  # ---------------------------------------------------------------------------
  process_controller_00:
    process:        worker_process_00
    req_host_cfg:   default_configuration
    functionality:
      py_module:    xact.lib.control.process
    state_type:     py_dict

  # ---------------------------------------------------------------------------
  process_controller_01:
    process:        worker_process_01
    req_host_cfg:   default_configuration
    functionality:
      py_module:    xact.lib.control.process
    state_type:     py_dict

  # ---------------------------------------------------------------------------
  process_controller_02:
    process:        worker_process_02
    req_host_cfg:   default_configuration
    functionality:
      py_module:    xact.lib.control.process
    state_type:     py_dict

  # ---------------------------------------------------------------------------
  sensor:
    process:        master_process
    req_host_cfg:   default_configuration
    functionality:
      py_module:    xact.app.simplex.sensor
    state_type:     py_dict

  # ---------------------------------------------------------------------------
  processor:
    process:        worker_process_00
    req_host_cfg:   default_configuration
    functionality:
      py_module:    xact.app.simplex.processor
    state_type:     py_dict

  # ---------------------------------------------------------------------------
  backpressurizer:
    process:        worker_process_01
    req_host_cfg:   default_configuration
    functionality:
      py_module:    xact.app.simplex.backpressurizer
    state_type:     py_dict

  # ---------------------------------------------------------------------------
  display:
    process:        worker_process_02
    req_host_cfg:   default_configuration
    functionality:
      py_module:    xact.lib.util.printer
    state_type:     py_dict
    config:
      path:
        - data
      output:       stdout
      pretty:       True


###############################################################################
edge:

  # ----------------------------------------------
  # System controller control signals to process controllers.

- owner: system_controller
  data:  py_dict
  src:   system_controller.outputs.control_00
  dst:   process_controller_00.inputs.control

- owner: system_controller
  data:  py_dict
  src:   system_controller.outputs.control_01
  dst:   process_controller_01.inputs.control

- owner: system_controller
  data:  py_dict
  src:   system_controller.outputs.control_02
  dst:   process_controller_02.inputs.control

  # ----------------------------------------------
  # Process controller feedback to system controller.

- owner: process_controller_00
  data:  py_dict
  src:   process_controller_00.outputs.feedback
  dst:   system_controller.inputs.feedback_00
  dirn:  feedback

- owner: process_controller_01
  data:  py_dict
  src:   process_controller_01.outputs.feedback
  dst:   system_controller.inputs.feedback_01
  dirn:  feedback

- owner: process_controller_02
  data:  py_dict
  src:   process_controller_02.outputs.feedback
  dst:   system_controller.inputs.feedback_02
  dirn:  feedback

  # ----------------------------------------------
  # Process controllers to functional nodes.

- owner: system_controller
  data:  py_dict
  src:   system_controller.outputs.control_03
  dst:   sensor.inputs.control

- owner: process_controller_00
  data:  py_dict
  src:   process_controller_00.outputs.control
  dst:   processor.inputs.control

- owner: process_controller_01
  data:  py_dict
  src:   process_controller_01.outputs.control
  dst:   backpressurizer.inputs.control

- owner: process_controller_02
  data:  py_dict
  src:   process_controller_02.outputs.control
  dst:   display.inputs.control

  # ----------------------------------------------
  # Functional node to functional node.

- owner: sensor
  data:  py_dict
  src:   sensor.outputs.data
  dst:   processor.inputs.data

- owner: processor
  data:  py_dict
  src:   processor.outputs.data
  dst:   backpressurizer.inputs.data

- owner: backpressurizer
  data:  py_dict
  src:   backpressurizer.outputs.data
  dst:   display.inputs.data


###############################################################################
data:
  py_dict:  py_dict
  py_str:   py_str


###############################################################################
req_host_cfg:
  default_configuration:
    role:
      - default_role


###############################################################################
role:
  default_role:
    tasks:
      - name: Update apt-get repo and cache
        become:        yes
        become_user:   root
        become_method: sudo
        apt:
          update_cache:     yes
          force_apt_get:    yes
          cache_valid_time: 3600
