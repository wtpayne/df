<!DOCTYPE html>
<html>

<head>
  <title>Memex Chat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/memex-style.css') }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
</head>

<body>
  <div class="container my-5">
    <h1 class="text-center">Memex Chat</h1>


    <div class="row my-5">
      <div class="col-md-6 offset-md-3">

        <div id="messages-container" class="messages-container">
        </div>

      </div>
    </div>
    <div class="row my-5">
      <div class="col-md-6 offset-md-3">
        <form class="my-3" id="message-form">
          <div class="input-group">
            <div class="input-group">
              <input type="text" name="message" placeholder="" class="form-control input-message" required>
              <button type="submit" class="btn btn-primary btn-send">Send</button>
            </div>

        </form>

      </div>
    </div>
  </div>
  <script src="//cdnjs.cloudflare.com/ajax/libs/socket.io/3.1.3/socket.io.js"></script>
  <script type="text/javascript">
    var socket = io.connect('http://' + document.domain + ':' + location.port);

    socket.on('connect', function () {
      console.log('Socket connected');
    });

    socket.on('disconnect', function () {
      console.log('Socket disconnected');
    });

    socket.on('update_messages', function (data) {
      var messages = data.messages;
      var messageContainer = document.querySelector('.messages-container');
      messageContainer.innerHTML = '';

      messages.forEach(function (message) {
        var messageClass = document.createElement('div');
        messageClass.className = 'message';

        var messageCard = document.createElement('div');
        messageCard.className = 'message-card';

        var messageText = document.createElement('div');
        messageText.className = 'card-text';
        messageText.innerText = message.text;

        var messageSubtitle = document.createElement('div');
        messageSubtitle.className = 'card-subtitle';

        if (message.sender === 'bot') {
          messageCard.classList.add('bot-message');
          messageText.classList.add('bot-message');
          messageSubtitle.classList.add('bot-message');
        }
        else {
          messageCard.classList.add('user-message');
          messageText.classList.add('user-message');
          messageSubtitle.classList.add('user-message');
        }

        var senderText = document.createElement('span');
        senderText.innerText = message.sender + ' | ';
        var timestampText = document.createElement('span');
        timestampText.innerText = new Date(message.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        messageSubtitle.appendChild(senderText);
        messageSubtitle.appendChild(timestampText);


        messageCard.appendChild(messageText);
        messageCard.appendChild(messageSubtitle);
        messageClass.appendChild(messageCard);
        messageContainer.appendChild(messageClass);
      });

      var messagesContainer = document.getElementById("messages-container");
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    });
    document.querySelector('#message-form').addEventListener('submit', function (event) {
      event.preventDefault();
      var messageInput = document.querySelector('input[name="message"]');
      var messageText = messageInput.value;
      messageInput.value = '';
      socket.send(messageText);
    });

    function formatTimestamp(timestamp) {
      const date = new Date(timestamp);
      const hours = date.getHours().toString().padStart(2, '0');
      const minutes = date.getMinutes().toString().padStart(2, '0');
      const seconds = date.getSeconds().toString().padStart(2, '0');
      return `${hours}:${minutes}:${seconds}`;
    }
  </script>


</body>

</html>
