# ------------------------------------------------------------------------------
# Vieww logic as a coroutine.
#
coro_view:                        _spec::flowforge.main.coro

# ------------------------------------------------------------------------------
# Viewport and top level window.
#
vp:
  _fcn:                           create_viewport
  _kwargs:
    title:                        "FlowForge"
    width:                        1024
    height:                       768

  win:
    _fcn:                         add_window
    _misc:
      set_primary_window:         True

    # --------------------------------------------------------------------------
    # Application menubar
    #
    menu:
      _fcn:                       add_menu_bar

      file:
        _fcn:                     add_menu
        _kwargs:
          label:                  "File"

        open:
          _fcn:                   add_menu_item
          _kwargs:
            label:                "Open"
            callback:             _spec::flowforge.main.menu_file_open

