# ------------------------------------------------------------------------------
# Vieww logic as a coroutine.
#
coro:                              _spec::flowforge.main.coro
am_update:                         _spec::flowforge.main.am_update

# ------------------------------------------------------------------------------
# Event handler registry.
#
event:
  _fcn:                           add_handler_registry

  mouseright:
    _fcn:                         add_mouse_click_handler
    _kwargs:
      button:                     _spec::dearpygui.dearpygui.mvMouseButton_Right
      callback:                   _spec::flowforge.main.mouseright

# ------------------------------------------------------------------------------
# Font registry
#
font:
  _fcn:                           add_font_registry

  fira_code:
    _fcn:                         add_font
    _kwargs:
      file:                       _spec::flowforge.main.FILEPATH_FONT_FIRA_CODE
      size:                       10

# ------------------------------------------------------------------------------
# Icon texture registry
#
icon:
  _fcn:                           add_texture_registry

  play_16x16:
    _fcn:                         add_static_texture
    _kwargs:
      width:                      16
      height:                     16
      default_value:              _spec::flowforge.main.ICON_PLAY_16X16

  pause_16x16:
    _fcn:                         add_static_texture
    _kwargs:
      width:                      16
      height:                     16
      default_value:              _spec::flowforge.main.ICON_PAUSE_16X16

  stop_16x16:
    _fcn:                         add_static_texture
    _kwargs:
      width:                      16
      height:                     16
      default_value:              _spec::flowforge.main.ICON_STOP_16X16

# ------------------------------------------------------------------------------
# Viewport and top level window.
#
vp:
  _fcn:                           create_viewport
  _kwargs:
    title:                        "FlowForge"
    width:                        2048
    height:                       768

  win:
    _fcn:                         add_window
    _misc:
      set_primary_window:         True

    # --------------------------------------------------------------------------
    # Right-click context menu.
    #
    ctx:
      _fcn:                       add_window
      _kwargs:
        label:                    "Edit"
        popup:                    True
        no_move:                  True
        modal:                    False
        autosize:                 False
        show:                     False
        width:                    85
        height:                   20

      edit:
        _fcn:                     add_text
        _kwargs:
          default_value:          ""

      node_add:
        _fcn:                     add_button
        _kwargs:
          label:                  "Add Node"
          width:                  85
          callback:               _spec::flowforge.main.ctx_node_add

      node_edit:
        _fcn:                     add_button
        _kwargs:
          label:                  "Edit Node"
          width:                  85
          callback:               _spec::flowforge.main.ctx_node_edit

      node_del:
        _fcn:                     add_button
        _kwargs:
          label:                  "Delete Node"
          width:                  85
          callback:               _spec::flowforge.main.ctx_node_del

      node_cancel:
        _fcn:                     add_button
        _kwargs:
          label:                  "Cancel"
          width:                  85
          callback:               _spec::flowforge.main.ctx_node_cancel

    # --------------------------------------------------------------------------
    # Application menubar
    #
    menu:
      _fcn:                       add_menu_bar

      file:
        _fcn:                     add_menu
        _kwargs:
          label:                  "File"

        open:
          _fcn:                   add_menu_item
          _kwargs:
            label:                "Open"
            callback:             _spec::flowforge.main.menu_file_open

        save:
          _fcn:                   add_menu_item
          _kwargs:
            label:                "Save"
            callback:             _spec::flowforge.main.menu_file_save

      edit:
        _fcn:                     add_menu
        _kwargs:
          label:                  "Edit"

        undo:
          _fcn:                   add_menu_item
          _kwargs:
            label:                "Undo"
            callback:             _spec::flowforge.main.menu_edit_undo

        redo:
          _fcn:                   add_menu_item
          _kwargs:
            label:                "Redo"
            callback:             _spec::flowforge.main.menu_edit_redo

      run:
        _fcn:                     add_menu
        _kwargs:
          label:                  "Run"

        start:
          _fcn:                   add_menu_item
          _kwargs:
            label:                "Start"
            callback:             _spec::flowforge.main.menu_run_start

        pause:
          _fcn:                   add_menu_item
          _kwargs:
            label:                "Pause"
            callback:             _spec::flowforge.main.menu_run_pause

        stop:
          _fcn:                   add_menu_item
          _kwargs:
            label:                "Stop"
            callback:             _spec::flowforge.main.menu_run_stop

      tools:
        _fcn:                     add_menu
        _kwargs:
          label:                  "Tools"

        about:
          _fcn:                   add_menu_item
          _kwargs:
            label:                "Show About"
            callback:             _spec::flowforge.main.menu_tools_about

        metrics:
          _fcn:                   add_menu_item
          _kwargs:
            label:                "Show Metrics"
            callback:             _spec::flowforge.main.menu_tools_metrics

        doc:
          _fcn:                   add_menu_item
          _kwargs:
            label:                "Show Documentation"
            callback:             _spec::flowforge.main.menu_tools_doc

        debug:
          _fcn:                   add_menu_item
          _kwargs:
            label:                "Show Debug Tool"
            callback:             _spec::flowforge.main.menu_tools_debug

        style:
          _fcn:                   add_menu_item
          _kwargs:
            label:                "Show Style Editor"
            callback:             _spec::flowforge.main.menu_tools_style

        font:
          _fcn:                   add_menu_item
          _kwargs:
            label:                "Show Font Editor"
            callback:             _spec::flowforge.main.menu_tools_font

        itemreg:
          _fcn:                   add_menu_item
          _kwargs:
            label:                "Show Item Registry"
            callback:             _spec::flowforge.main.menu_tools_itemreg

      help:
        _fcn:                     add_menu
        _kwargs:
          label:                  "Help"

        doc:
          _fcn:                   add_menu_item
          _kwargs:
            label:                "Documentation"
            callback:             _spec::flowforge.main.menu_help_doc

        about:
          _fcn:                   add_menu_item
          _kwargs:
            label:                "About"
            callback:             _spec::flowforge.main.menu_help_about

    toolbar:
      _fcn:                       add_group
      _kwargs:
        horizontal:               True
        horizontal_spacing:       0.0

      pad_left:
        _fcn:                     add_spacer
        _kwargs:
          width:                  0

      play:
        _fcn:                     add_image_button
        _kwargs:
          label:                  "Play"
          texture_tag:            vm.icon.play_16x16
          callback:               _spec::flowforge.main.ctx_node_edit

      pause:
        _fcn:                     add_image_button
        _kwargs:
          label:                  "Pause"
          texture_tag:            vm.icon.pause_16x16
          callback:               _spec::flowforge.main.ctx_node_edit

      stop:
        _fcn:                     add_image_button
        _kwargs:
          label:                  "Stop"
          texture_tag:            vm.icon.stop_16x16
          callback:               _spec::flowforge.main.ctx_node_edit


    # -------------------------------------------------------------------------
    # Main workspace
    #
    main:
      _fcn:                       add_group
      _kwargs:
        horizontal:               True

      # -----------------------------------------------------------------------
      # Sidebar
      #
      side:
        _fcn:                     add_child_window
        _kwargs:
          width:                  _spec::flowforge.main.SIDEBAR_WIDTH
          border:                 True
          autosize_y:             True

        tab:
          _fcn:                   add_tab_bar

          cfg:
            _fcn:                 add_tab
            _kwargs:
              label:              "Cfg"

            sys:
              _fcn:               add_collapsing_header
              _kwargs:
                label:            "System"

              id:
                _fcn:             add_input_text
                _kwargs:
                  label:          "System ID"
                  indent:         _spec::flowforge.main.INDENT
                  width:          _spec::flowforge.main.SIDEBAR_WIDGET_WIDTH
                  callback:       _spec::pl.stableview.update_from_view
                  on_enter:       True
                _bind:
                  -               am.system.id_system

              separator:
                _fcn:             add_separator

            host:
              _fcn:               add_collapsing_header
              _kwargs:
                label:            "Host"

              count:
                _fcn:             add_input_int
                _kwargs:
                  label:          "Host count"
                  indent:         _spec::flowforge.main.INDENT
                  width:          _spec::flowforge.main.SIDEBAR_WIDGET_WIDTH
                  default_value:  1
                  min_value:      1  # We rely on there being at least one host.
                  min_clamped:    True
                  callback:       _spec::flowforge.main.host_count

              separator:
                _fcn:             add_separator

            proc:
              _fcn:               add_collapsing_header
              _kwargs:
                label:            "Process"

              count:
                _fcn:             add_input_int
                _kwargs:
                  label:          "Process count"
                  indent:         _spec::flowforge.main.INDENT
                  width:          _spec::flowforge.main.SIDEBAR_WIDGET_WIDTH
                  default_value:  1
                  min_value:      1
                  min_clamped:    True
                  callback:       _spec::flowforge.main.proc_count

              separator:
                _fcn:             add_separator

            node:
              _fcn:               add_collapsing_header
              _kwargs:
                label:            "Node"

              id:
                _fcn:             add_input_text
                _kwargs:
                  label:          "Node ID"
                  indent:         _spec::flowforge.main.INDENT
                  width:          _spec::flowforge.main.SIDEBAR_WIDGET_WIDTH
                  callback:       _spec::flowforge.main.node_id

              # proc:
              #   _fcn:             add_combo
              #   _kwargs:
              #     label:          "Process ID"
              #     items:          [""]
              #     indent:         _spec::flowforge.main.INDENT
              #     width:          _spec::flowforge.main.SIDEBAR_WIDGET_WIDTH
              #     callback:       _spec::flowforge.main.node_proc

              func:
                _fcn:             add_input_text
                _kwargs:
                  label:          "Implementation"
                  indent:         _spec::flowforge.main.INDENT
                  width:          _spec::flowforge.main.SIDEBAR_WIDGET_WIDTH

              state:
                _fcn:             add_input_text
                _kwargs:
                  label:          "State data type"
                  indent:         _spec::flowforge.main.INDENT
                  width:          _spec::flowforge.main.SIDEBAR_WIDGET_WIDTH

              cfg:
                _fcn:             add_input_text
                _kwargs:
                  label:          "Configuration"
                  indent:         _spec::flowforge.main.INDENT
                  width:          _spec::flowforge.main.SIDEBAR_WIDGET_WIDTH

              countin:
                _fcn:             add_input_int
                _kwargs:
                  label:          "Input count"
                  indent:         _spec::flowforge.main.INDENT
                  width:          _spec::flowforge.main.SIDEBAR_WIDGET_WIDTH
                  min_value:      0
                  min_clamped:    True
                  callback:       _spec::flowforge.main.node_input_count

              countout:
                _fcn:             add_input_int
                _kwargs:
                  label:          "Output count"
                  indent:         _spec::flowforge.main.INDENT
                  width:          _spec::flowforge.main.SIDEBAR_WIDGET_WIDTH
                  min_value:      0
                  min_clamped:    True
                  callback:       _spec::flowforge.main.node_output_count

              separator:
                _fcn:             add_separator

            # Edges
            edge:
              _fcn:               add_collapsing_header
              _kwargs:
                label:            "Edge"

              owner:
                _fcn:             add_input_text
                _kwargs:
                  label:          "Owner"
                  indent:         _spec::flowforge.main.INDENT
                  width:          _spec::flowforge.main.SIDEBAR_WIDGET_WIDTH

              datatype:
                _fcn:             add_input_text
                _kwargs:
                  label:          "Data type"
                  indent:         _spec::flowforge.main.INDENT
                  width:          _spec::flowforge.main.SIDEBAR_WIDGET_WIDTH

              separator:
                _fcn:             add_separator

      # -----------------------------------------------------------------------
      # Node editor
      #
      nodeeditor:
        _fcn:                     add_node_editor
        _kwargs:
          minimap:                True
          tracked:                True
          minimap_location:       _spec::flowforge.main.BOTTOM_RIGHT
          callback:               _spec::flowforge.main.node_link
          delink_callback:        _spec::flowforge.main.node_delink


binding:

  win_font:
    _fcn:                         bind_item_font
    _kwargs:
      item:                       vm.vp.win
      font:                       vm.font.fira_code

  ctx_font:
    _fcn:                         bind_item_font
    _kwargs:
      item:                       vm.vp.win.ctx
      font:                       vm.font.fira_code
