# ------------------------------------------------------------------------------
# Vieww logic as a coroutine.
#
coro_view:                        _spec::flowforge.main.coro

# ------------------------------------------------------------------------------
# Event handler registry.
#
event:
  _fcn:                           add_handler_registry

  mouseright:
    _fcn:                         add_mouse_click_handler
    _kwargs:
      button:                     _spec::dearpygui.dearpygui.mvMouseButton_Right
      callback:                   _spec::flowforge.main.mouseright

# ------------------------------------------------------------------------------
# Font registry
#
font:
  _fcn:                           add_font_registry

  fira_code:
    _fcn:                         add_font
    _kwargs:
      file:                       _spec::flowforge.main.FILEPATH_FONT_FIRA_CODE
      size:                       10

# ------------------------------------------------------------------------------
# Icon texture registry
#
icon:
  _fcn:                           add_texture_registry

  play_24x24:
    _fcn:                         add_static_texture
    _kwargs:
      width:                      24
      height:                     24
      default_value:              _spec::flowforge.main.ICON_PLAY_24X24

  pause_24x24:
    _fcn:                         add_static_texture
    _kwargs:
      width:                      24
      height:                     24
      default_value:              _spec::flowforge.main.ICON_PAUSE_24X24

  stop_24x24:
    _fcn:                         add_static_texture
    _kwargs:
      width:                      24
      height:                     24
      default_value:              _spec::flowforge.main.ICON_STOP_24X24

# ------------------------------------------------------------------------------
# Viewport and top level window.
#
vp:
  _fcn:                           create_viewport
  _kwargs:
    title:                        "FlowForge"
    width:                        2048
    height:                       768

  win:
    _fcn:                         add_window
    _misc:
      set_primary_window:         True

    # --------------------------------------------------------------------------
    # Right-click context menu.
    #
    ctx:
      _fcn:                       add_window
      _kwargs:
        label:                    "Edit"
        popup:                    True
        no_move:                  True
        modal:                    False
        autosize:                 False
        show:                     False
        width:                    85
        height:                   20

      node_add:
        _fcn:                     add_button
        _kwargs:
          label:                  "Add Node"
          width:                  85
          callback:               _spec::flowforge.main.ctx_node_add

      node_edit:
        _fcn:                     add_button
        _kwargs:
          label:                  "Edit Node"
          width:                  85
          callback:               _spec::flowforge.main.ctx_node_edit

      node_del:
        _fcn:                     add_button
        _kwargs:
          label:                  "Delete Node"
          width:                  85
          callback:               _spec::flowforge.main.ctx_node_del

      node_cancel:
        _fcn:                     add_button
        _kwargs:
          label:                  "Cancel"
          width:                  85
          callback:               _spec::flowforge.main.ctx_node_cancel

    # --------------------------------------------------------------------------
    # Application menubar
    #
    menu:
      _fcn:                       add_menu_bar

      file:
        _fcn:                     add_menu
        _kwargs:
          label:                  "File"

        open:
          _fcn:                   add_menu_item
          _kwargs:
            label:                "Open"
            callback:             _spec::flowforge.main.menu_file_open

        save:
          _fcn:                   add_menu_item
          _kwargs:
            label:                "Save"
            callback:             _spec::flowforge.main.menu_file_save

      edit:
        _fcn:                     add_menu
        _kwargs:
          label:                  "Edit"

        undo:
          _fcn:                   add_menu_item
          _kwargs:
            label:                "Undo"
            callback:             _spec::flowforge.main.menu_edit_undo

        redo:
          _fcn:                   add_menu_item
          _kwargs:
            label:                "Redo"
            callback:             _spec::flowforge.main.menu_edit_redo

      run:
        _fcn:                     add_menu
        _kwargs:
          label:                  "Run"

        start:
          _fcn:                   add_menu_item
          _kwargs:
            label:                "Start"
            callback:             _spec::flowforge.main.menu_run_start

        pause:
          _fcn:                   add_menu_item
          _kwargs:
            label:                "Pause"
            callback:             _spec::flowforge.main.menu_run_pause

        stop:
          _fcn:                   add_menu_item
          _kwargs:
            label:                "Stop"
            callback:             _spec::flowforge.main.menu_run_stop

      tools:
        _fcn:                     add_menu
        _kwargs:
          label:                  "Tools"

        about:
          _fcn:                   add_menu_item
          _kwargs:
            label:                "Show About"
            callback:             _spec::flowforge.main.menu_tools_about

        metrics:
          _fcn:                   add_menu_item
          _kwargs:
            label:                "Show Metrics"
            callback:             _spec::flowforge.main.menu_tools_metrics

        doc:
          _fcn:                   add_menu_item
          _kwargs:
            label:                "Show Documentation"
            callback:             _spec::flowforge.main.menu_tools_doc

        debug:
          _fcn:                   add_menu_item
          _kwargs:
            label:                "Show Debug Tool"
            callback:             _spec::flowforge.main.menu_tools_debug

        style:
          _fcn:                   add_menu_item
          _kwargs:
            label:                "Show Style Editor"
            callback:             _spec::flowforge.main.menu_tools_style

        font:
          _fcn:                   add_menu_item
          _kwargs:
            label:                "Show Font Editor"
            callback:             _spec::flowforge.main.menu_tools_font

        itemreg:
          _fcn:                   add_menu_item
          _kwargs:
            label:                "Show Item Registry"
            callback:             _spec::flowforge.main.menu_tools_itemreg

      help:
        _fcn:                     add_menu
        _kwargs:
          label:                  "Help"

        doc:
          _fcn:                   add_menu_item
          _kwargs:
            label:                "Documentation"
            callback:             _spec::flowforge.main.menu_help_doc

        about:
          _fcn:                   add_menu_item
          _kwargs:
            label:                "About"
            callback:             _spec::flowforge.main.menu_help_about

    # -------------------------------------------------------------------------
    # Main workspace
    #
    main:
      _fcn:                       add_group
      _kwargs:
        horizontal:               False

      toolbar:
        _fcn:                     add_group
        _kwargs:
          horizontal:             True
          horizontal_spacing:     0.0

        pad_left:
          _fcn:                   add_spacer
          _kwargs:
            width:                0

        play:
          _fcn:                   add_image_button
          _kwargs:
            label:                "Play"
            texture_tag:          cfg.icon.play_24x24
            callback:             _spec::flowforge.main.ctx_node_edit

        pause:
          _fcn:                   add_image_button
          _kwargs:
            label:                "Pause"
            texture_tag:          cfg.icon.pause_24x24
            callback:             _spec::flowforge.main.ctx_node_edit

        stop:
          _fcn:                   add_image_button
          _kwargs:
            label:                "Stop"
            texture_tag:          cfg.icon.stop_24x24
            callback:             _spec::flowforge.main.ctx_node_edit


      #   # ---------------------------------------------------------------------
      #   # Sidebar
      #   #
      #   side:
      #     _fcn:                     add_child_window
      #     _kwargs:
      #       width:                  _spec::flowforge.main.SIDEBAR_WIDTH
      #       border:                 True
      #       autosize_y:             True

      # ---------------------------------------------------------------------
      # Node editor
      #
      nodeeditor:
        _fcn:                     add_node_editor
        _kwargs:
          minimap:                True
          tracked:                True
          minimap_location:       _spec::flowforge.main.BOTTOM_RIGHT
          callback:               _spec::flowforge.main.node_link
          delink_callback:        _spec::flowforge.main.node_delink


binding:

  win_font:
    _fcn:                         bind_item_font
    _kwargs:
      item:                       cfg.vp.win
      font:                       cfg.font.fira_code

  ctx_font:
    _fcn:                         bind_item_font
    _kwargs:
      item:                       cfg.vp.win.ctx
      font:                       cfg.font.fira_code
