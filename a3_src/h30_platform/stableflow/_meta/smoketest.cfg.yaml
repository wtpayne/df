system:
  id_system: stableflow_smoketest


###############################################################################
host:
  localhost:
    hostname:        'localhost'
    acct_run:        'wtp'
    acct_provision:  'wtp'
    port_range:      '8090-9000'
    dirpath_log:     ''
    log_level:       'TRACE'


###############################################################################
process:
  main_process:
    host: localhost


###############################################################################
node:

  # ---------------------------------------------------------------------------
  ctrl_sys:
    process:        main_process
    req_host_cfg:   default_configuration
    functionality:
      py_module:    stableflow.lib.test.native.controller.system
    state_type:     py_dict
    config:
      frequency_hz: 1
      idx_max:      300

  # ---------------------------------------------------------------------------
  ctrl_proc:
    process:        main_process
    req_host_cfg:   default_configuration
    functionality:
      py_module:    stableflow.lib.test.native.controller.process
    state_type:     py_dict

  # ---------------------------------------------------------------------------
  printer:
    process:        main_process
    req_host_cfg:   default_configuration
    functionality:
      py_module:    stableflow.lib.test.native.native_printer
    state_type:     py_dict
    config:
      output:       stdout
      pretty:       true


###############################################################################
edge:
- owner: ctrl_sys
  data:  py_dict
  src:   ctrl_sys.outputs.control
  dst:   ctrl_proc.inputs.control

- owner: ctrl_proc
  data:  py_dict
  src:   ctrl_proc.outputs.control
  dst:   printer.inputs.control


###############################################################################
data:
  py_list:  py_list
  py_dict:  py_dict
  py_str:   py_str


###############################################################################
req_host_cfg:
  default_configuration:
    role:
      - default_role


###############################################################################
role:
  default_role:
    tasks:
      - name: Update apt-get repo and cache
        become:        yes
        become_user:   root
        become_method: sudo
        apt:
          update_cache:     yes
          force_apt_get:    yes
          cache_valid_time: 3600
