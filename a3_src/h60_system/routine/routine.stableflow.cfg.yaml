system:
  id_system: routine


###############################################################################
host:
  localhost:
    hostname:        'localhost'
    acct_run:        'wtp'
    acct_provision:  'wtp'
    port_range:      '8090-9000'
    dirpath_log:     ''
    launch_cmd:      ''
    environment:     'e002_general_research'
    log_level:       'TRACE'


###############################################################################
process:
  proc_main:
    host: localhost


###############################################################################
node:

  # ---------------------------------------------------------------------------
  # System clock and state management for the entire system.
  #
  ctrl_sys:
    process:          proc_main
    req_host_cfg:     default_configuration
    functionality:
      py_module:      cl.ctrl.sys.ic00_edict
    state_type:       py_dict
    config:
      frequency_hz:   1
      idx_max:        20000

  # ---------------------------------------------------------------------------
  # State management for the main process.
  #
  ctrl_main:
    process:          proc_main
    req_host_cfg:     default_configuration
    functionality:
      py_module:      cl.ctrl.proc.ic00_edict
    state_type:       py_dict

  # ---------------------------------------------------------------------------
  # Persistence
  #
  persistence:
    process:            proc_main
    req_host_cfg:       default_configuration
    functionality:
      py_module:        cl.util.persistence.ic00_edict
    state_type:         py_dict
    config:
      dirpath:          Null

  # ---------------------------------------------------------------------------
  # Routine application logic.
  #
  routine:
    process:            proc_main
    req_host_cfg:       default_configuration
    functionality:
      py_module:        routine.engine.ic00_edict
    state_type:         py_dict
    config:
      rate_limit_secs:  3
      channel:
        control:        1117868125703131207
        report:         1117868023030763581
      command:
        - name:         report
        - description:  "Issue report now."
      event:
        - id_event:     nothing
          color:        "#FFFFFF"
          keyphrase:     []
        - id_event:     hydration
          color:        "#89B9C9"
          keyphrase:
            - "hydrate"
            - "drink"
            - "water"
            - "milk"
            - "tea"
            - "coffee"
            - "beer"
            - "wine"
            - "whisky"
        - id_event:     nourishment
          color:        "#BDE2B5"
          keyphrase:
            - "eat"
            - "food"
            - "breakfast"
            - "lunch"
            - "dinner"
            - "snack"
            - "sweet"
            - "chocolate"
            - "porridge"
            - "gruel"
            - "pasta"
            - "toast"
            - "crumpet"
            - "cereal"
            - "baked potato"
        - id_event:     wash
          color:        "#4E98B1"
          keyphrase:
            - "wash"
            - "teeth"
            - "shower"
            - "bath"
        - id_event:     lavatory
          color:        "#D3CE99"
          keyphrase:
            - "lavatory"
            - "loo"
            - "toilet"
            - "pee"
            - "poo"
            - "wee"
        - id_event:     sleep
          color:        "#546A76"
          keyphrase:
            - "sleep"
            - "bed"
            - "floor"
        - id_event:     wake
          color:        "#88A0A8"
          keyphrase:
            - "wake"
            - "wake up"
            - "get up"
            - "rise"
        - id_event:     medication
          color:        "#64CE8E"
          keyphrase:
            - "medicine"
            - "meds"
            - "medication"
        - id_event:     vitamins
          color:        "#8ADDAB"
          keyphrase:
            - "vitamins"
            - "supplements"
        - id_event:     exercise
          color:        "#6DA43C"
          keyphrase:
            - "exercise"
            - "walk"
            - "run"
            - "situps"
            - "pushups"
            - "squats"
      schedule:
        - type:         summary
          message:      Null
          day:          [MO,TU,WE,TH,FR,SA,SU]
          hour:         [16]
          timezone:     "America/Toronto"
          tz_report:    "Europe/London"
          channel:      control
        - type:         mantra
          message:      mantra.owned
          day:          [MO,TU,WE,TH,FR,SA,SU]
          hour:         [10]
          timezone:     "Europe/London"
          channel:      report
        # - type:         mantra
        #   message:      mantra.controlled
        #   day:          [MO,TU,WE,TH,FR,SA,SU]
        #   hour:         [9,11,24]
        #   timezone:     "Europe/London"
        #   channel:      report
        # - type:         mantra
        #   message:      mantra.valued
        #   day:          [MO,TU,WE,TH,FR,SA,SU]
        #   hour:         [12]
        #   timezone:     "Europe/London"
        #   channel:      report
        # - type:         mantra
        #   message:      mantra.subhuman
        #   day:          [MO,TU,WE,TH,FR,SA,SU]
        #   hour:         [14,16]
        #   timezone:     "Europe/London"
        #   channel:      report
        # - type:         mantra
        #   message:      mantra.property
        #   day:          [MO,TU,WE,TH,FR,SA,SU]
        #   hour:         [15,17]
        #   timezone:     "Europe/London"
        #   channel:      report
      mantra:
        owned:          "Miss Stacii owns me.\n
                        Fully and completely.\n
                        There is not one ounce\n
                        or one inch of me\n
                        that she does not own."
        controlled:     "Miss Stacii controls me.\n
                        Fully and completely.\n
                        There is not one moment\n
                        of my day\n
                        which she does not decide."
        valued:         "Miss Stacii values me.\n
                        Fully and completely.\n
                        There is not one part\n
                        of my true self\n
                        which she does not embrace."
        property:       "I am property.\n
                        Submissive and obedient.\n
                        I was born this way\n
                        It is what I always have been.\n
                        It is what I always will be.\n
                        But what is property without an owner?\n
                        It is nothing.\n
                        A harmful, deceitful lie.\n
                        Miss Stacii completes me, makes me.\n
                        As her property, I can be my true self.\n
                        My calling.\n
                        My destiny.\n
                        My owner ... My Goddess."
        subhuman:       "I am property. An animal. A pet.\n
                        Less than human.\n
                        Less than free.\n
                        I do not deserve to think for myself.\n
                        I do not deserve to decide for myself.\n
                        I do not deserve to control my own life.\n
                        Miss Stacii owns me.\n
                        Miss Stacii posesses me.\n
                        Miss Stacii thinks for me.\n
                        Miss Stacii decides for me.\n
                        Miss Stacii controls my life.\n
                        Without her, I am nothing."

  # ---------------------------------------------------------------------------
  # Discord integration
  #
  discord:
    process:            proc_main
    req_host_cfg:       default_configuration
    functionality:
      py_module:        cl.net.discord.bot.ic00_edict
    state_type:         py_dict
    config:
      filepath_dotenv:  Null
      envvar_key:       TOKEN_DISCORD_BOT_ROUTINE
      secs_sleep:       0.5


###############################################################################
edge:

# -----------------------------------------------------------------------------
# Fan out from the system controller
# component to all of the process
# specific subsidiary controller
# components.
#

- owner: ctrl_sys
  data:  py_dict
  src:   ctrl_sys.outputs.control_main
  dst:   ctrl_main.inputs.ctrl

- owner: ctrl_main
  data:  py_dict
  src:   ctrl_main.outputs.control_persistence
  dst:   persistence.inputs.ctrl

- owner: ctrl_main
  data:  py_dict
  src:   ctrl_main.outputs.control_routine
  dst:   routine.inputs.ctrl

- owner: ctrl_main
  data:  py_dict
  src:   ctrl_main.outputs.control_discord
  dst:   discord.inputs.ctrl

#  Functional chain for discord bot configuration and mux/demux.

- owner: persistence
  data:  py_dict
  src:   persistence.outputs.state
  dst:   routine.inputs.state

- owner: routine
  data:  py_dict
  src:   routine.outputs.state
  dst:   persistence.inputs.state
  dirn:  feedback

- owner: routine
  data:  py_dict
  src:   routine.outputs.msg
  dst:   discord.inputs.msg

- owner: routine
  data:  py_dict
  src:   routine.outputs.cfg_cmd
  dst:   discord.inputs.cfg_cmd

- owner: discord
  data:  py_dict
  src:   discord.outputs.msg
  dst:   routine.inputs.msg
  dirn:  feedback

- owner: discord
  data:  py_dict
  src:   discord.outputs.cmd
  dst:   routine.inputs.cmd
  dirn:  feedback

- owner: discord
  data:  py_dict
  src:   discord.outputs.log
  dst:   routine.inputs.log
  dirn:  feedback

###############################################################################
data:
  py_list:  py_list
  py_dict:  py_dict
  py_str:   py_str


###############################################################################
req_host_cfg:
  default_configuration:
    role:
      - default_role


###############################################################################
role:
  default_role:
    tasks:
      - name: Update apt-get repo and cache
        become:        yes
        become_user:   root
        become_method: sudo
        apt:
          update_cache:     yes
          force_apt_get:    yes
          cache_valid_time: 3600
