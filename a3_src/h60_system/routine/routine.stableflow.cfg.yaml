system:
  id_system: routine


###############################################################################
host:
  localhost:
    hostname:        'localhost'
    acct_run:        'wtp'
    acct_provision:  'wtp'
    port_range:      '8090-9000'
    dirpath_log:     ''
    launch_cmd:      ''
    environment:     'e002_general_research'
    log_level:       'TRACE'


###############################################################################
process:
  proc_main:
    host: localhost


###############################################################################
node:

  # ---------------------------------------------------------------------------
  # System clock and state management for the entire system.
  #
  ctrl_sys:
    process:          proc_main
    req_host_cfg:     default_configuration
    functionality:
      py_module:      cl.ctrl.sys.ic00_edict
    state_type:       py_dict
    config:
      frequency_hz:   2
      idx_max:        200

  # ---------------------------------------------------------------------------
  # State management for the main process.
  #
  ctrl_main:
    process:          proc_main
    req_host_cfg:     default_configuration
    functionality:
      py_module:      cl.ctrl.proc.ic00_edict
    state_type:       py_dict

  # ---------------------------------------------------------------------------
  # Routine application logic.
  #
  routine:
    process:        proc_main
    req_host_cfg:   default_configuration
    functionality:
      py_module:    routine.engine.ic00_edict
    state_type:     py_dict
    config:
      channel:
        control:    1115742663002554503
        report:     1115742503044386816
      daily_summary:
        channel:    control
        timezone:   "America/Toronto"
        hour:       16
      events:
        hydration:
          - "hydrate"
          - "drink"
          - "water"
          - "milk"
          - "tea"
          - "coffee"
          - "beer"
          - "wine"
          - "whisky"


  # ---------------------------------------------------------------------------
  # Discord integration
  #
  discord:
    process:            proc_main
    req_host_cfg:       default_configuration
    functionality:
      py_module:        cl.net.discord.client.ic00_edict
    state_type:         py_dict
    config:
      filepath_dotenv:  Null
      envvar_token:     TOKEN_DISCORD_BOT_ROUTINE
      secs_interval:    0.5


###############################################################################
edge:

# -----------------------------------------------------------------------------
# Fan out from the system controller
# component to all of the process
# specific subsidiary controller
# components.
#

- owner: ctrl_sys
  data:  py_dict
  src:   ctrl_sys.outputs.control_main
  dst:   ctrl_main.inputs.control

- owner: ctrl_main
  data:  py_dict
  src:   ctrl_main.outputs.control_routine
  dst:   routine.inputs.control

- owner: routine
  data:  py_dict
  src:   routine.outputs.msg
  dst:   discord.inputs.msg

- owner: discord
  data:  py_dict
  src:   discord.outputs.msg
  dst:   routine.inputs.msg
  dirn:  feedback


###############################################################################
data:
  py_list:  py_list
  py_dict:  py_dict
  py_str:   py_str


###############################################################################
req_host_cfg:
  default_configuration:
    role:
      - default_role


###############################################################################
role:
  default_role:
    tasks:
      - name: Update apt-get repo and cache
        become:        yes
        become_user:   root
        become_method: sudo
        apt:
          update_cache:     yes
          force_apt_get:    yes
          cache_valid_time: 3600
