system:
  id_system: accord


###############################################################################
host:
  localhost:
    hostname:        'localhost'
    acct_run:        'wtp'
    acct_provision:  'wtp'
    port_range:      '8090-9000'
    dirpath_log:     ''
    launch_cmd:      ''
    environment:     'e002_general_research'
    log_level:       'TRACE'


###############################################################################
process:
  proc_main:
    host: localhost


###############################################################################
node:

  # ---------------------------------------------------------------------------
  # System clock and state management for the entire system.
  #
  ctrl_sys:
    process:          proc_main
    req_host_cfg:     default_configuration
    functionality:
      py_module:      cl.ctrl.sys.ic00_edict
    state_type:       py_dict
    config:
      frequency_hz:   1
      idx_max:        20

  # ---------------------------------------------------------------------------
  # State management for the main process.
  #
  ctrl_main:
    process:          proc_main
    req_host_cfg:     default_configuration
    functionality:
      py_module:      cl.ctrl.proc.ic00_edict
    state_type:       py_dict

  # ---------------------------------------------------------------------------
  # Accord application logic
  #
  accord:
    process:        proc_main
    req_host_cfg:   default_configuration
    functionality:
      py_module:    accord.engine.ic00_edict
    state_type:     py_dict
    config:
      channel:
        admin:      1115744080907997204
        room_01:    1115744295845118032
        room_02:    1115744329131106325
        room_03:    1115744378623893675
        room_04:    1115744396005097592
        room_05:    1115744413751185570

  # ---------------------------------------------------------------------------
  # Discord integration
  #
  discord:
    process:          proc_main
    req_host_cfg:     default_configuration
    functionality:
      py_module:      cl.net.discord.client.ic00_edict
    state_type:       py_dict
    config:
      filepath_env:   Null
      envvar_token:   TOKEN_DISCORD_BOT_ACCORD
      secs_interval:  1



###############################################################################
edge:

# -----------------------------------------------------------------------------
# Fan out from the system controller
# component to all of the process
# specific subsidiary controller
# components.
#

- owner: ctrl_sys
  data:  py_dict
  src:   ctrl_sys.outputs.control_main
  dst:   ctrl_main.inputs.control

- owner: ctrl_main
  data:  py_dict
  src:   ctrl_main.outputs.control_accord
  dst:   accord.inputs.control

- owner: accord
  data:  py_dict
  src:   accord.outputs.msg
  dst:   discord.inputs.msg

- owner: discord
  data:  py_dict
  src:   discord.outputs.msg
  dst:   accord.inputs.msg
  dirn:  feedback


###############################################################################
data:
  py_list:  py_list
  py_dict:  py_dict
  py_str:   py_str


###############################################################################
req_host_cfg:
  default_configuration:
    role:
      - default_role


###############################################################################
role:
  default_role:
    tasks:
      - name: Update apt-get repo and cache
        become:        yes
        become_user:   root
        become_method: sudo
        apt:
          update_cache:     yes
          force_apt_get:    yes
          cache_valid_time: 3600
